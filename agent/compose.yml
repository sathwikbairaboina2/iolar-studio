# The agent that edits reels. It runs no model itself — it calls Ollama — so it
# asks for no GPU. The model lives in the Ollama installed on the host, on 11434.
services:
  iolar-agent:
    build: .
    container_name: iolar-agent
    ports:
      - "127.0.0.1:3121:3121"
    environment:
      # The studio and Ollama both run on the host, not in this network.
      STUDIO_URL: http://host.docker.internal:3120
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
