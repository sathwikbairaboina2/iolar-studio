<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../_shared/ui.css">
<title>agent roster</title>
<div class="phone">
  <div class="bar"><div class="title">Workspace</div><div class="sub">8 bots</div></div>
  <div class="scroll"><div class="track" id="track"></div></div>
</div>
<script>
const BOTS = [
  ['Chief',            '#c9b6ff', 'Yesterday', 'booked the venue and sent the contract'],
  ['Sales Outbound',   '#ffcf7a', '2:23 PM',   '41 replies drafted, <b>12 booked</b>'],
  ['Inbox Manager',    '#7ad3ff', '11:23 AM',  'inbox at zero, <b>5 drafts</b> parked for you'],
  ['Account Manager',  '#a8f0c6', '9:23 AM',   'renewal note added to Globex'],
  ['Talent Scout',     '#ffb3c7', '6:23 AM',   '3 intros written in your voice, held for review'],
  ['Expense Manager',  '#ffd48a', '10:23 AM',  'report filed. <b>9 receipts</b>, nothing outstanding'],
  ['Release Bot',      '#b7c4ff', '10:02 AM',  'cut 2.4.1, changelog posted'],
  ['Support Triage',   '#9be7d4', '8:23 AM',   '17 tickets sorted, 2 escalated'],
  ['Offsite Crew',     '#e6b0ff', '8:23 AM',   'that leaves the pipeline. spinning up outbound'],
  ['Docs Bot',         '#c2f0a8', 'Mon',       'rewrote the quickstart, PR open'],
  ['Invoice Bot',      '#ffd0a8', 'Mon',       'cleared <b>23 invoices</b> out of the inbox'],
  ['Bug Reproducer',   '#ff9ea8', 'Mon',       'reproduced #4181, filed the ticket'],
  ['Meeting Notes',    '#b8d8ff', 'Sun',       'notes and actions posted for 4 calls'],
  ['Onboarding',       '#d6f0a8', 'Sun',       'seated 2 new hires, accounts provisioned'],
  ['Research',         '#c6b8ff', 'Sun',       'competitor pricing tracked, diff attached'],
  ['Renewals',         '#a8e6f0', 'Sat',       '6 renewals flagged, 2 at risk'],
];
const track = document.getElementById('track');
track.innerHTML = BOTS.map(([n, c, w, l]) => `
  <div class="row">
    <div class="dot" style="background:${c}">${n[0]}</div>
    <div class="body">
      <div class="name">${n}<span class="when">${w}</span></div>
      <div class="line">${l}</div>
    </div>
  </div>`).join('');

window.SCENE = {
  frame(p) {
    const travel = Math.max(0, track.scrollHeight - document.querySelector('.scroll').clientHeight);
    // ease so the scroll settles rather than stopping dead
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    track.style.transform = `translateY(${-travel * e}px)`;
  },
};
</script>
