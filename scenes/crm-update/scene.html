<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../_shared/ui.css">
<title>crm update</title>
<style>
  .field { display:flex; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .field .k { color: var(--dim); }
  .field .v { font-weight:600; text-align:right; opacity:0; transform:translateY(6px); }
  .field .v.on { opacity:1; transform:none; transition:opacity .18s ease, transform .18s ease; }
  .note { margin-top:16px; font-size:14px; line-height:1.5; color:var(--dim); }
  .cursor { display:inline-block; width:2px; height:1.05em; background:var(--accent); vertical-align:-2px; }
  /* Something is always moving: a record that sits still for a second reads as a freeze. */
  .track { will-change: transform; }
  .pulse { height:3px; border-radius:2px; background:linear-gradient(90deg,var(--accent),transparent); margin:2px 0 0; }
</style>
<div class="phone">
  <div class="bar"><div class="title">Acme Corp</div><div class="sub">updated by Sales Bot</div></div>
  <div class="scroll">
    <div class="track" style="padding:4px 20px">
      <div class="card" style="margin:16px 0">
        <div class="field"><span class="k">Stage</span><span class="v" data-i="0">Proposal sent</span></div>
        <div class="field"><span class="k">Value</span><span class="v" data-i="1">$48,000</span></div>
        <div class="field"><span class="k">Next step</span><span class="v" data-i="2">Security review</span></div>
        <div class="field"><span class="k">Owner</span><span class="v" data-i="3">Account Manager</span></div>
        <div class="field" style="border:0"><span class="k">Call notes</span><span class="v" data-i="4">Added · 6 min ago</span></div>
      </div>
      <div class="pulse" id="pulse" style="width:0%"></div>
      <div class="note" id="note"></div>
      <div class="card" style="margin:18px 0 0">
        <div style="font-size:13px;color:var(--dim);margin-bottom:10px">Activity</div>
        <div class="field" style="padding:10px 0"><span class="k">Call transcript</span><span class="v on">attached</span></div>
        <div class="field" style="padding:10px 0"><span class="k">Follow-up</span><span class="v on">Thursday 10:00</span></div>
        <div class="field" style="border:0;padding:10px 0"><span class="k">SOC 2 report</span><span class="v on">sent</span></div>
      </div>
    </div>
  </div>
</div>
<script>
const NOTE = 'They want SOC 2 evidence before signing. Pulled the report, attached it, and booked the security call for Thursday.';
const vs = [...document.querySelectorAll('.v')];
const note = document.getElementById('note');
const track = document.querySelector('.track');
const pulse = document.getElementById('pulse');
window.SCENE = {
  frame(p) {
    // fields commit one by one, the note types itself out, and the record creeps upward
    // throughout so no part of the shot is ever static
    vs.forEach((v, i) => v.classList.toggle('on', p > 0.06 + i * 0.07));
    const start = 0.42;
    const typed = p < start ? 0 : Math.round(((p - start) / (1 - start)) * NOTE.length);
    note.innerHTML = NOTE.slice(0, typed) + (typed < NOTE.length ? '<span class="cursor"></span>' : '');
    pulse.style.width = Math.min(100, p * 130).toFixed(1) + '%';
    const travel = Math.max(0, track.scrollHeight - document.querySelector('.scroll').clientHeight);
    track.style.transform = 'translateY(' + (-travel * p).toFixed(1) + 'px)';
  },
};
</script>
