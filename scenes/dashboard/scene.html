<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../_shared/ui.css">
<title>dashboard</title>
<style>
  .kpi { display:flex; gap:12px; margin:16px 20px; }
  .box { flex:1; padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
  .box .n { font-size:26px; font-weight:720; letter-spacing:-.5px; }
  .box .l { font-size:11.5px; color:var(--dim); margin-top:3px; }
  .chart { margin:6px 20px 0; height:190px; display:flex; align-items:flex-end; gap:7px; }
  .bar2 { flex:1; background:linear-gradient(180deg,var(--accent),#2a4a8f); border-radius:5px 5px 0 0; }
  .legend { margin:10px 20px; font-size:12px; color:var(--dim); }
</style>
<div class="phone">
  <div class="bar"><div class="title">This week</div><div class="sub">agents</div></div>
  <div class="scroll"><div class="track">
    <div class="kpi">
      <div class="box"><div class="n" id="k1">0</div><div class="l">tasks finished</div></div>
      <div class="box"><div class="n" id="k2">0</div><div class="l">hours saved</div></div>
    </div>
    <div class="chart" id="chart"></div>
    <div class="legend">Mon to Sun, finished without you</div>
  </div></div>
</div>
<script>
const H = [34, 52, 41, 68, 77, 59, 88];
const chart = document.getElementById('chart');
chart.innerHTML = H.map(function () { return '<div class="bar2" style="height:2%"></div>'; }).join('');
const bars = Array.prototype.slice.call(document.querySelectorAll('.bar2'));
const k1 = document.getElementById('k1');
const k2 = document.getElementById('k2');
window.SCENE = {
  frame: function (p) {
    bars.forEach(function (b, i) {
      const local = Math.max(0, Math.min(1, (p - i * 0.07) / 0.35));
      b.style.height = Math.max(2, H[i] * local) + '%';
    });
    k1.textContent = Math.round(419 * Math.min(1, p * 1.3));
    k2.textContent = Math.round(96 * Math.min(1, p * 1.3));
  },
};
</script>
