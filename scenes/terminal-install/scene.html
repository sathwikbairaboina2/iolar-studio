<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../_shared/ui.css">
<title>terminal</title>
<style>
  /* Not pure black: a shot this dark reads as a hole in the cut, and ffmpeg's
     blackdetect agrees — it flagged the original twice. */
  body { background:#141822; }
  .pane { margin:14px 16px; border:1px solid #2b3242; border-radius:12px; background:#191e29; overflow:hidden; }
  .chrome { display:flex; gap:7px; padding:11px 14px; border-bottom:1px solid #2b3242; background:#1f2533; }
  .chrome i { width:11px; height:11px; border-radius:50%; display:block; }
  pre { margin:0; padding:16px 16px 20px; font-family:ui-monospace,Consolas,monospace; font-size:13px; line-height:1.8; color:#dfe5ef; white-space:pre-wrap; }
  .ok { color:#4ade80; }
  .dim { color:#8b93a7; }
  .acc { color:#9ec5ff; }
  .cursor { display:inline-block; width:8px; height:1em; background:#dfe5ef; vertical-align:-2px; }
</style>
<div class="phone">
  <div class="bar" style="background:#1f2533"><div class="title">agent · shell</div><div class="sub">running</div></div>
  <div class="scroll"><div class="pane">
    <div class="chrome"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <pre id="out"></pre>
  </div></div>
</div>
<script>
const LINES = [
  ['$ agent run inbox --since 24h', ''],
  ['  connecting to mail', 'dim'],
  ['  ok  authenticated as you', 'ok'],
  ['  scanning 412 threads', 'dim'],
  ['  drafted 18 replies', 'acc'],
  ['  filed 23 invoices', 'acc'],
  ['  flagged 2 for review', 'acc'],
  ['  done in 41s', 'ok'],
  ['$ agent schedule inbox --daily 07:00', ''],
  ['  ok  scheduled', 'ok'],
  ['$ agent status', ''],
  ['  inbox      running   next 07:00', 'dim'],
  ['  crm        running   next 08:30', 'dim'],
  ['  invoices   running   next 09:00', 'dim'],
  ['  releases   idle', 'dim'],
];
const out = document.getElementById('out');
const total = LINES.reduce(function (n, l) { return n + l[0].length + 1; }, 0);
window.SCENE = {
  frame: function (p) {
    const chars = Math.round(p * total);
    let used = 0;
    let html = '';
    for (const line of LINES) {
      const text = line[0];
      const cls = line[1];
      const take = Math.max(0, Math.min(text.length, chars - used));
      if (take > 0) {
        html += cls ? '<span class="' + cls + '">' + text.slice(0, take) + '</span>\n' : text.slice(0, take) + '\n';
      }
      used += text.length + 1;
    }
    out.innerHTML = html + '<span class="cursor"></span>';
  },
};
</script>
