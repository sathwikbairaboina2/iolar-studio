<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../_shared/ui.css">
<title>inbox clearing</title>
<style>
  .mail { display:flex; gap:12px; padding:15px 20px; border-bottom:1px solid var(--line); align-items:flex-start; transition:opacity .25s ease, transform .25s ease; }
  .mail.gone { opacity:0; transform:translateX(-40px); }
  .mail .sub { font-size:14px; font-weight:600; }
  .mail .from { font-size:13px; color:var(--dim); margin-top:3px; }
  .amt { margin-left:auto; font-size:14px; font-weight:650; color:var(--dim); }
  .count { position:absolute; left:0; right:0; top:38%; text-align:center; font-size:15px; color:var(--dim); }
  .count b { color:var(--good); font-size:26px; display:block; margin-bottom:6px; }
  /* Refilling keeps the frame alive: an inbox that empties to black is a hole in the reel. */
  .mail.fresh { opacity:0; transform:translateX(28px); }
</style>
<div class="phone">
  <div class="bar"><div class="title">Invoices</div><div class="sub" id="left">23 unread</div></div>
  <div class="scroll"><div class="track" id="track"></div><div class="count" id="count"></div></div>
</div>
<script>
const MAILS = [
  ['Northwind Ltd · INV-2214','accounts@northwind.co','$4,120'],
  ['Globex · INV-8871','billing@globex.com','$12,600'],
  ['Initech · INV-0432','ap@initech.io','$980'],
  ['Umbrella · INV-5590','finance@umbrella.co','$7,340'],
  ['Soylent · INV-1180','invoices@soylent.dev','$2,250'],
  ['Hooli · INV-7723','ap@hooli.xyz','$18,900'],
  ['Vehement · INV-3391','billing@vehement.io','$640'],
  ['Massive Dynamic · INV-6612','ap@massive.dyn','$9,410'],
];
const track = document.getElementById('track');
track.innerHTML = MAILS.map(([s,f,a]) => `
  <div class="mail"><div><div class="sub">${s}</div><div class="from">${f}</div></div><div class="amt">${a}</div></div>`).join('');
const rows=[...document.querySelectorAll('.mail')];
const left=document.getElementById('left'), count=document.getElementById('count');
window.SCENE = {
  frame(p) {
    // invoices clear from the top while new ones arrive underneath, so the list keeps
    // moving and the frame never empties out
    const cleared = Math.floor(p * rows.length * 0.75);
    rows.forEach((r, i) => {
      r.classList.toggle('gone', i < cleared);
      r.classList.toggle('fresh', i > cleared + 5 + Math.floor(p * 3));
    });
    const remaining = Math.max(2, 23 - cleared * 3);
    left.textContent = remaining > 2 ? remaining + ' unread' : 'almost clear';
    count.innerHTML = p > 0.78 ? '<b>' + cleared * 3 + ' cleared</b>nothing left outstanding' : '';
  },
};
</script>
