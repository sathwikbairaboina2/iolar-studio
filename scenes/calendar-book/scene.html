<!doctype html>
<html data-ui="light">
<meta charset="utf-8">
<link rel="stylesheet" href="../_shared/ui.css">
<title>calendar</title>
<style>
  .day { display:flex; gap:10px; padding:10px 20px; align-items:center; border-bottom:1px solid var(--line); }
  .hour { width:52px; font-size:12px; color:var(--dim); flex:0 0 auto; }
  .slot { flex:1 1 auto; height:34px; border-radius:8px; background:var(--panel); display:flex; align-items:center; padding:0 12px; font-size:13px; color:var(--dim); }
  .slot.busy { background:var(--panel-2); color:var(--text); }
  .slot.new { background:var(--accent); color:#06070d; font-weight:650; opacity:0; transform:scale(.96); }
  .slot.new.on { opacity:1; transform:none; transition:opacity .2s ease, transform .2s ease; }
</style>
<div class="phone">
  <div class="bar"><div class="title">Thursday</div><div class="sub" id="sub">finding a slot</div></div>
  <div class="scroll"><div class="track" id="track"></div></div>
</div>
<script>
const HOURS = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];
const BUSY = { '09:00':'Standup', '11:00':'1:1 with Priya', '14:00':'Design review', '17:00':'Retro' };
const track = document.getElementById('track');
track.innerHTML = HOURS.map(function (h) {
  if (BUSY[h]) return '<div class="day"><div class="hour">' + h + '</div><div class="slot busy">' + BUSY[h] + '</div></div>';
  if (h === '10:00') return '<div class="day"><div class="hour">' + h + '</div><div class="slot new" id="slot">Security call, Acme</div></div>';
  return '<div class="day"><div class="hour">' + h + '</div><div class="slot">free</div></div>';
}).join('');
const slot = document.getElementById('slot');
const sub = document.getElementById('sub');
window.SCENE = {
  frame: function (p) {
    slot.classList.toggle('on', p > 0.35);
    sub.textContent = p > 0.55 ? 'invite sent' : p > 0.35 ? 'booking' : 'finding a slot';
    const travel = Math.max(0, track.scrollHeight - document.querySelector('.scroll').clientHeight);
    track.style.transform = 'translateY(' + (-travel * Math.min(1, p * 1.1)) + 'px)';
  },
};
</script>
