<!doctype html>
<html data-ui="light">
<meta charset="utf-8">
<link rel="stylesheet" href="../_shared/ui.css">
<title>draft reply</title>
<style>
  .head { padding:16px 20px; border-bottom:1px solid var(--line); }
  .head .to { font-size:13px; color:var(--dim); }
  .head .subj { font-size:16px; font-weight:650; margin-top:4px; }
  .quote { margin:16px 20px; padding-left:12px; border-left:2px solid var(--line); font-size:13.5px; color:var(--dim); line-height:1.5; }
  .body { margin:6px 20px; font-size:15px; line-height:1.6; white-space:pre-wrap; }
  .cursor { display:inline-block; width:2px; height:1.05em; background:var(--accent); vertical-align:-2px; }
  .send { margin:18px 20px; padding:13px; text-align:center; border-radius:12px; background:var(--panel-2); color:var(--dim); font-weight:650; font-size:15px; }
  .send.on { background:var(--accent); color:#fff; }
</style>
<div class="phone">
  <div class="bar"><div class="title">Draft</div><div class="sub" id="who">written in your voice</div></div>
  <div class="scroll"><div class="track">
    <div class="head"><div class="to">To: procurement@globex.com</div><div class="subj">Re: renewal and seat count</div></div>
    <div class="quote">Can you confirm the seat count before we sign? Also need the security doc.</div>
    <div class="body" id="body"></div>
    <div class="send" id="send">Hold for review</div>
  </div></div>
</div>
<script>
const TEXT = 'Confirmed, 240 seats on the current plan, and the SOC 2 report is attached.\n\nThursday 10:00 is held for the security call. Say the word and the invite goes out.';
const body = document.getElementById('body');
const send = document.getElementById('send');
const who = document.getElementById('who');
window.SCENE = {
  frame: function (p) {
    const typed = Math.round(Math.min(1, p / 0.82) * TEXT.length);
    body.innerHTML = TEXT.slice(0, typed) + (typed < TEXT.length ? '<span class="cursor"></span>' : '');
    send.classList.toggle('on', p > 0.86);
    send.textContent = p > 0.86 ? 'Waiting on you' : 'Hold for review';
    who.textContent = p > 0.5 ? 'draft ready' : 'written in your voice';
  },
};
</script>
