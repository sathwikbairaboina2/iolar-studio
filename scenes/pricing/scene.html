<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../_shared/ui.css">
<title>pricing</title>
<style>
  .plan { margin:0 20px; padding:26px 24px; border:1px solid var(--line); border-radius:22px; background:linear-gradient(180deg,#17171c,#111114); }
  .price { font-size:64px; font-weight:750; letter-spacing:-2px; line-height:1; }
  .price small { font-size:20px; font-weight:500; color:var(--dim); letter-spacing:0; }
  .li { display:flex; gap:10px; align-items:flex-start; font-size:15px; padding:9px 0; opacity:0; transform:translateY(8px); }
  .li.on { opacity:1; transform:none; transition:opacity .2s ease, transform .2s ease; }
  .cta { margin-top:20px; text-align:center; padding:15px; border-radius:14px; background:var(--text); color:#0b0b0d; font-weight:700; font-size:16px; }
</style>
<div class="phone">
  <div class="bar"><div class="title">Plans</div><div class="sub">billed monthly</div></div>
  <div class="scroll"><div class="track" style="padding-top:22px">
    <div class="plan">
      <span class="tag">Top tier</span>
      <div class="price" style="margin:14px 0 6px">$200<small> / month</small></div>
      <div style="color:var(--dim);font-size:14px;margin-bottom:14px">per seat, cancel anytime</div>
      <div class="li" data-i="0"><span class="tick">✓</span><span>Every agent gets its own machine</span></div>
      <div class="li" data-i="1"><span class="tick">✓</span><span>Signs in to the tools you already pay for</span></div>
      <div class="li" data-i="2"><span class="tick">✓</span><span>Runs on a schedule, or while you sleep</span></div>
      <div class="li" data-i="3"><span class="tick">✓</span><span>Desktop, mobile and chat</span></div>
      <div class="cta">Get started</div>
    </div>
  </div></div>
</div>
<script>
const lis=[...document.querySelectorAll('.li')];
window.SCENE = { frame(p) { lis.forEach((l,i)=>l.classList.toggle('on', p > 0.12 + i*0.14)); } };
</script>
