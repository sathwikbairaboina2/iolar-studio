<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../_shared/ui.css">
<title>bug ticket</title>
<style>
  .step { display:flex; gap:12px; padding:14px 20px; align-items:flex-start; opacity:.25; transition:opacity .25s ease; }
  .step.on { opacity:1; }
  .step .mark { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:0 0 auto; display:grid; place-items:center; font-size:12px; }
  .step.on .mark { border-color:var(--good); color:var(--good); }
  .step .what { font-size:15px; font-weight:600; }
  .step .detail { font-size:13px; color:var(--dim); margin-top:3px; line-height:1.4; }
  pre { margin:14px 20px; padding:16px; background:#0e0e11; border:1px solid var(--line); border-radius:12px; font-size:12.5px; line-height:1.6; color:#c8c8d2; overflow:hidden; font-family:ui-monospace,Consolas,monospace; }
  .pass { color:var(--good); }
</style>
<div class="phone">
  <div class="bar"><div class="title">#4181 · crash on retry</div><div class="sub">Engineering Bot</div></div>
  <div class="scroll"><div class="track">
    <div class="step" data-i="0"><div class="mark">✓</div><div><div class="what">Reproduced locally</div><div class="detail">3 of 3 attempts, same stack</div></div></div>
    <div class="step" data-i="1"><div class="mark">✓</div><div><div class="what">Narrowed to retry backoff</div><div class="detail">timer reset on the wrong branch</div></div></div>
    <div class="step" data-i="2"><div class="mark">✓</div><div><div class="what">Wrote a failing test</div><div class="detail">retry_after_timeout</div></div></div>
    <pre id="code"></pre>
    <div class="step" data-i="3"><div class="mark">✓</div><div><div class="what">Opened PR #912</div><div class="detail">handed to you for review</div></div></div>
  </div></div>
</div>
<script>
const CODE = `- if (attempt > max) reset();\n+ if (attempt >= max) reset();\n\n  test retry_after_timeout ... ok`;
const steps=[...document.querySelectorAll('.step')];
const code=document.getElementById('code');
window.SCENE = {
  frame(p) {
    steps.forEach((s,i)=>s.classList.toggle('on', p > 0.08 + i*0.2));
    const start=0.35;
    const typed = p < start ? 0 : Math.round(((p-start)/(1-start))*CODE.length);
    const shown = CODE.slice(0, typed).replace('... ok','... <span class="pass">ok</span>');
    code.innerHTML = shown;
  },
};
</script>
