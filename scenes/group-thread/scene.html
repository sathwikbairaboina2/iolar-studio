<!doctype html>
<html data-ui="light">
<meta charset="utf-8">
<link rel="stylesheet" href="../_shared/ui.css">
<title>group thread</title>
<div class="phone">
  <div class="bar"><div class="title">Offsite crew</div><div class="sub">4 bots · you</div></div>
  <div class="scroll"><div class="track" id="track" style="padding:16px 20px"></div></div>
</div>
<script>
const MSGS = [
  ['stamp', '7:13 AM'],
  ['me',    "let's close out the offsite. what's left?"],
  ['them',  'recap doc is done and owners are tagged. <b>3 follow-ups</b> land this week.'],
  ['them',  'thank-you notes went out to the venue and the speakers this morning.'],
  ['stamp', '8:13 AM'],
  ['them',  "recap shared. follow-ups assigned:<br>✓ Acme pricing → Account Manager<br>✓ Speaker thank-yous → Inbox Manager<br>✓ Final invoice → me"],
  ['me',    'great close-out. anything we missed?'],
  ['them',  "nobody has touched the quiet accounts. I'd spin up a dedicated agent for outbound."],
  ['me',    'do it.'],
  ['stamp', '9:02 AM'],
  ['them',  'Outbound agent is up. It has the CRM, the calendar and the shared inbox.'],
  ['them',  'First pass: <b>60 quiet accounts</b>. Drafts land in your review queue at noon.'],
  ['me',    'who signs off?'],
  ['them',  'You do. Nothing sends without you.'],
  ['stamp', '12:00 PM'],
  ['them',  '<b>18 drafts</b> ready. Each one cites the last thing they told us.'],
  ['me',    'ship the top five.'],
  ['them',  'Sent. I will chase the replies and book anything warm.'],
];
document.getElementById('track').innerHTML = MSGS.map(([k, t]) =>
  k === 'stamp' ? `<div class="stamp">${t}</div>`
  : `<div class="msg ${k}" style="margin:8px 0">${t}</div>`).join('');

const track = document.getElementById('track');
window.SCENE = {
  frame(p) {
    const travel = Math.max(0, track.scrollHeight - document.querySelector('.scroll').clientHeight);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    track.style.transform = `translateY(${-travel * e}px)`;
  },
};
</script>
