<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
:root{--ink-blue:#2b3f8f;--ink-red:#c0392b;--ink-green:#2d6a4f;--ink-black:#333;--ink-accent:#e8a0a8;--paper:#fff}
body{font-family:'Kalam',cursive;background:#dcd7cc}
#page{background:repeating-linear-gradient(#ffffff,#ffffff calc(2.05vh - 1px),#e3e9f2 2.05vh);
  padding:2.6vh 5vw 2.5vh 16vw;counter-reset:qnum}
#page::before{content:"";position:absolute;left:13vw;top:0;bottom:0;width:2px;background:var(--ink-accent);z-index:0}
.hole-strip{position:absolute;left:2vw;top:0;bottom:0;width:3vw;display:flex;flex-direction:column;justify-content:space-around;z-index:2;padding:2vh 0}
.hole-strip i{height:1vh;width:2.4vw;border:.3vh solid #2a2a2a;border-radius:50%;display:block;background:#fff}
.badge{position:absolute;top:2.2vh;left:5vw;font-size:1.7vh;color:var(--ink-black);z-index:1;font-family:'Patrick Hand',cursive}
.badge .handle{color:var(--ink-red);text-decoration:underline wavy var(--ink-red) 1.5px;text-underline-offset:.4vh}
.page-n{position:absolute;top:2.2vh;right:5vw;font-size:1.9vh;color:var(--ink-blue);font-weight:700;
  font-family:'Patrick Hand',cursive;text-decoration:underline;z-index:1}
.series{font-family:'Caveat',cursive;text-align:center;font-size:3.6vh;font-weight:700;color:var(--ink-blue);margin:3.4vh 0 .2vh;position:relative;z-index:1;
  text-decoration:underline wavy var(--ink-red) 2px;text-underline-offset:.7vh}
.page-title{font-family:'Patrick Hand',cursive;text-align:center;font-size:2vh;color:var(--ink-black);letter-spacing:.2vw;
  display:block;width:fit-content;margin:.6vh auto 1.4vh;text-decoration:underline;font-weight:700;position:relative;z-index:1}

.b-heading{font-family:'Caveat',cursive;font-size:2.3vh;font-weight:700;color:var(--ink-blue);
  text-decoration:underline wavy currentColor 1.5px;text-underline-offset:.5vh;margin:1.1vh 0 .3vh}
.b-paragraph{font-size:1.6vh;color:var(--ink-blue);line-height:1.9;margin:.4vh 0}
.b-bullets{margin:.4vh 0 .4vh 1.5vw}
.b-bullets li{font-size:1.58vh;color:var(--ink-blue);line-height:1.9;list-style:none}
.b-bullets li::before{content:"→ ";color:var(--ink-red)}
.b-sidebox{border-radius:6px;padding:.7vh 1.4vw;margin:1vh 0;background:var(--paper);max-width:85%}
.b-sidebox .sb-title{font-family:'Caveat',cursive;font-size:1.9vh;font-weight:700;color:var(--ink-red);text-decoration:underline;margin-bottom:.2vh}
.b-sidebox li{font-size:1.5vh;color:var(--ink-black);line-height:1.8;margin-left:1.2vw;list-style:none}
.b-sidebox li::before{content:"• "}
.b-table{width:100%;border-collapse:collapse;font-size:1.42vh;background:var(--paper);margin:.8vh 0}
.b-table th{font-family:'Patrick Hand',cursive;font-size:1.6vh;color:var(--ink-blue);text-decoration:underline}
.b-table th,.b-table td{border:1.8px solid #445;padding:.35vh .8vw;text-align:center;color:var(--ink-black)}
.b-code{font-family:'JetBrains Mono',monospace;font-size:1.32vh;color:var(--ink-blue);background:var(--paper);
  border:2px dashed var(--ink-blue);border-radius:5px;padding:.6vh 1.2vw;margin:.6vh 0 .6vh 3vw;line-height:1.7;white-space:pre-wrap;max-width:86%}
.b-callout{border-radius:6px;padding:.7vh 1.6vw;margin:1vh 0;background:var(--paper);max-width:82%}
.b-callout .co-title{font-family:'Caveat',cursive;font-size:1.9vh;font-weight:700;text-decoration:underline}
.b-callout.co-tip .co-title{color:var(--ink-red)}
.b-callout.co-takeaway .co-title{color:var(--ink-red)}
.b-callout.co-cloud{border-radius:60px;text-align:center;transform:rotate(1.5deg)}
.b-callout.co-cloud .co-title{color:var(--ink-green);text-decoration:none}
.b-callout .co-text{font-size:1.5vh;color:var(--ink-black);line-height:1.75}
.b-callout.co-cloud .co-text{color:var(--ink-green)}

.b-qa{counter-increment:qnum;margin:1vh 0}
.b-qa .qa-q{font-size:1.75vh;color:var(--ink-red);font-weight:700;margin:.2vh 0 .3vh}
.b-qa .qa-q::before{content:"Q" counter(qnum) ". "}
.b-qa .qa-a{display:flex;align-items:flex-start;gap:.4vw}
.b-qa .qa-a li{font-size:1.6vh;color:var(--ink-blue);line-height:1.85;list-style:none}
.b-qa .qa-a li::before{content:"• "}
.b-diagram{margin:.8vh 0}
.b-diagram .dg-flow{display:flex;align-items:center;gap:.8vw;flex-wrap:wrap;font-size:1.45vh;color:var(--ink-black)}
.b-diagram .dg-node{background:var(--paper);padding:.4vh 1vw}
.b-diagram .dg-arrow{color:var(--ink-red);font-weight:700;font-size:1.8vh}
.b-diagram-staged{border:2px dashed #999;border-radius:5px;padding:.7vh 1.2vw;margin:.8vh 0;font-size:1.4vh;color:#777;background:var(--paper)}
</style>
</head>
<body>
<div id="page">
  <div class="hole-strip"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="badge">📷 Insta ID : <span class="handle" id="v-brand" data-jitter></span></div>
  <div class="page-n" id="v-pagen" data-jitter></div>
  <div class="series" id="v-series" data-jitter></div>
  <div class="page-title" id="v-ptitle" data-jitter></div>
  <div id="content"><!--CONTENT--></div>
  <div class="paper-texture"></div>
  <div class="vignette"></div>
</div>
<script src="../_shared/rough.min.js"></script>
<script src="../_shared/pack.js"></script>
<script src="../_shared/layout.js"></script>
<script src="../_shared/diagrams.js"></script>
<script src="../_shared/jitter.js"></script>
<!--PAGEVARS-->
<script>
  document.getElementById('v-brand').textContent = PAGE.brand;
  document.getElementById('v-pagen').textContent = 'PAGE ' + PAGE.pageNum;
  document.getElementById('v-series').textContent = PAGE.series;
  document.getElementById('v-ptitle').textContent = PAGE.page_title;
  document.fonts.ready.then(function () {
    applyLayout({ columns: PAGE.columns, rowGapPx: PAGE.rowGapPx });
    applyJitter(PAGE.seed + PAGE.pageNum);
  });
</script>
</body>
</html>
