<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
:root{--ink-blue:#5a4a42;--ink-red:#d4886f;--ink-green:#7fae94;--ink-black:#6b5d54;--ink-accent:#d4886f;--paper:#ffffff}
body{font-family:'Patrick Hand',cursive;background:#efe7da}
#page{background:linear-gradient(#faf6ef,#f7f1e6);padding:5.5vh 7vw 4vh}
.tape{position:absolute;width:24%;height:3.2vh;background:rgba(244,180,180,.55);top:1.8vh;left:38%;
  transform:rotate(-2deg);border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08);z-index:2}
.head{display:flex;justify-content:space-between;font-size:1.5vh;color:#a08d80;letter-spacing:.15vw;position:relative;z-index:1}
.series{font-family:'Caveat',cursive;text-align:center;font-size:3.2vh;font-weight:700;color:var(--ink-blue);margin:1vh 0 .2vh;position:relative;z-index:1}
.series .hl{background:linear-gradient(transparent 55%, #ffd9a0 55%, #ffd9a0 92%, transparent 92%);padding:0 .8vw}
.page-title{text-align:center;font-size:1.5vh;color:#a08d80;letter-spacing:.3vw;text-transform:uppercase;
  margin:.4vh auto 1.6vh;position:relative;z-index:1}

.b-heading{font-family:'Caveat',cursive;font-size:2.4vh;font-weight:700;color:var(--ink-blue);margin:1.3vh 0 .4vh}
.b-heading::before{content:"☁ ";color:var(--ink-red)}
.b-paragraph{font-size:1.62vh;color:var(--ink-black);line-height:1.95;margin:.4vh 0}
.b-bullets{margin:.4vh 0 .4vh 1.5vw}
.b-bullets li{font-size:1.6vh;color:var(--ink-black);line-height:2;list-style:none}
.b-bullets li::before{content:"✿ ";color:var(--ink-red);font-size:1.3vh}
.b-sidebox{border:none !important;border-radius:12px;padding:1vh 1.6vw;margin:1.1vh 0;background:var(--paper);
  box-shadow:0 4px 14px rgba(90,74,66,.13);max-width:88%}
.b-sidebox .sb-title{font-family:'Caveat',cursive;font-size:2vh;font-weight:700;color:var(--ink-red);margin-bottom:.3vh}
.b-sidebox .sb-title::before{content:"♡ "}
.b-sidebox li{font-size:1.52vh;color:var(--ink-black);line-height:1.85;margin-left:1vw;list-style:none}
.b-sidebox li::before{content:"· "}
.b-table{width:100%;border-collapse:separate;border-spacing:0;font-size:1.42vh;background:var(--paper);margin:.9vh 0;
  border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(90,74,66,.12)}
.b-table th{font-family:'Caveat',cursive;font-size:1.7vh;color:var(--ink-red);background:#fdf3ec}
.b-table th,.b-table td{border-bottom:1px solid #efe4d8;padding:.5vh 1vw;text-align:center;color:var(--ink-black)}
.b-code{font-family:'JetBrains Mono',monospace;font-size:1.32vh;color:var(--ink-blue);background:var(--paper);
  border-radius:10px;box-shadow:0 4px 14px rgba(90,74,66,.12);padding:.8vh 1.3vw;margin:.9vh 0;line-height:1.75;white-space:pre-wrap;max-width:92%}
.b-callout{border:none !important;border-radius:12px;padding:1vh 1.6vw;margin:1.1vh 0;background:var(--paper);
  box-shadow:0 4px 14px rgba(90,74,66,.13);max-width:85%}
.b-callout .co-title{font-family:'Caveat',cursive;font-size:2vh;font-weight:700;color:var(--ink-red)}
.b-callout.co-cloud{text-align:center}
.b-callout .co-text{font-size:1.52vh;color:var(--ink-black);line-height:1.85}
.b-qa .qa-q{font-size:1.72vh;color:var(--ink-red);font-weight:700;margin:1vh 0 .2vh}
.b-qa .qa-ans-label{color:var(--ink-green);font-weight:700;margin-right:.5vw}
.b-qa .qa-a li{font-size:1.58vh;color:var(--ink-black);line-height:1.9;margin-left:2vw;list-style:none}
.b-qa .qa-a li::before{content:"· "}
.b-diagram{margin:.8vh 0}
.b-diagram .dg-flow{display:flex;align-items:center;gap:.8vw;flex-wrap:wrap;font-size:1.45vh;color:var(--ink-black)}
.b-diagram .dg-node{background:var(--paper);padding:.5vh 1.1vw;border-radius:8px;box-shadow:0 3px 10px rgba(90,74,66,.12)}
.b-diagram .dg-arrow{color:var(--ink-red);font-weight:700;font-size:1.8vh}
.b-diagram-staged{border:2px dashed #cbb;border-radius:10px;padding:.7vh 1.2vw;margin:.8vh 0;font-size:1.4vh;color:#a99;background:var(--paper)}
.footer-dots{text-align:center;color:var(--ink-red);letter-spacing:.4vw;margin-top:1.2vh;font-size:1.6vh}
.paper-texture{opacity:.3}
</style>
</head>
<body>
<div id="page">
  <div class="tape"></div>
  <div class="head"><span id="v-brand" data-jitter></span><span id="v-date" data-jitter></span></div>
  <div class="series"><span class="hl" id="v-series" data-jitter></span></div>
  <div class="page-title" id="v-ptitle" data-jitter></div>
  <div id="content"><!--CONTENT--></div>
  <div class="footer-dots">· · · ✦ · · ·</div>
  <div class="paper-texture"></div>
  <div class="vignette"></div>
</div>
<script src="../_shared/rough.min.js"></script>
<script src="../_shared/pack.js"></script>
<script src="../_shared/layout.js"></script>
<script src="../_shared/diagrams.js"></script>
<script src="../_shared/jitter.js"></script>
<!--PAGEVARS-->
<script>
  document.getElementById('v-brand').textContent = PAGE.brand + ' · study notes';
  document.getElementById('v-date').textContent = PAGE.date;
  document.getElementById('v-series').textContent = PAGE.series;
  document.getElementById('v-ptitle').textContent = PAGE.page_title + ' · pt.' + PAGE.pageNum;
  document.fonts.ready.then(function () {
    applyLayout({ columns: PAGE.columns, rowGapPx: PAGE.rowGapPx });
    applyJitter(PAGE.seed + PAGE.pageNum);
  });
</script>
</body>
</html>
