<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
:root{--ink-blue:#24558c;--ink-red:#d35400;--ink-green:#1d6d40;--ink-black:#2c3e50;--ink-accent:#d35400;--paper:rgba(255,255,255,.78)}
body{font-family:'Architects Daughter',cursive;background:#e3e9f0}
#page{background:#f4f7fa;
  background-image:linear-gradient(rgba(70,110,160,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(70,110,160,.16) 1px,transparent 1px);
  background-size:1.3vh 1.3vh;padding:4.5vh 6vw 4vh}
.stamp{position:absolute;top:2.6vh;right:5vw;border:2.5px solid var(--ink-blue);color:var(--ink-blue);font-size:1.25vh;
  padding:.3vh 1vw;letter-spacing:.25vw;transform:rotate(2deg);font-weight:700;z-index:1;background:var(--paper)}
.head{font-size:1.5vh;color:#5b7ea6;position:relative;z-index:1}
.series{font-size:2.6vh;color:#173e6b;font-weight:700;letter-spacing:.08vw;margin:1.4vh 0 0;position:relative;z-index:1;
  border-bottom:.45vh solid var(--ink-red);display:block;width:fit-content;padding-bottom:.3vh}
.page-title{font-size:1.4vh;color:#5b7ea6;letter-spacing:.25vw;margin:.5vh 0 1.5vh;text-transform:uppercase;position:relative;z-index:1}

.b-heading{font-size:2vh;font-weight:700;color:var(--ink-blue);margin:1.2vh 0 .3vh}
.b-paragraph{font-size:1.55vh;color:var(--ink-black);line-height:1.85;margin:.4vh 0}
.b-bullets{margin:.4vh 0 .4vh 1.5vw}
.b-bullets li{font-size:1.52vh;color:var(--ink-black);line-height:1.9;list-style:none}
.b-bullets li::before{content:"▸ ";color:var(--ink-red)}
.b-sidebox{border:2.5px solid var(--ink-blue) !important;padding:.8vh 1.4vw;margin:1vh 0;background:var(--paper);
  box-shadow:.4vw .4vh 0 rgba(36,85,140,.18);max-width:88%}
.b-sidebox .sb-title{font-size:1.7vh;font-weight:700;color:var(--ink-red);margin-bottom:.2vh;text-transform:uppercase;letter-spacing:.1vw}
.b-sidebox li{font-size:1.48vh;color:var(--ink-black);line-height:1.8;margin-left:1.2vw;list-style:none}
.b-sidebox li::before{content:"– "}
.b-table{width:100%;border-collapse:collapse;font-size:1.42vh;background:var(--paper);margin:.8vh 0;
  box-shadow:.4vw .4vh 0 rgba(36,85,140,.15)}
.b-table th{font-size:1.5vh;color:var(--ink-blue);text-transform:uppercase;letter-spacing:.08vw;background:rgba(36,85,140,.08)}
.b-table th,.b-table td{border:2px solid var(--ink-blue);padding:.4vh .8vw;text-align:center;color:var(--ink-black)}
.b-code{font-family:'JetBrains Mono',monospace;font-size:1.32vh;color:var(--ink-blue);background:var(--paper);
  border:2px solid var(--ink-blue);border-left:.5vw solid var(--ink-red);padding:.7vh 1.2vw;margin:.8vh 0;line-height:1.75;white-space:pre-wrap;max-width:92%;
  box-shadow:.4vw .4vh 0 rgba(36,85,140,.15)}
.b-callout{border:2.5px solid var(--ink-red) !important;padding:.8vh 1.4vw;margin:1vh 0;background:var(--paper);
  box-shadow:.4vw .4vh 0 rgba(211,84,0,.15);max-width:88%}
.b-callout .co-title{font-size:1.7vh;font-weight:700;color:var(--ink-red);text-transform:uppercase;letter-spacing:.1vw}
.b-callout .co-text{font-size:1.48vh;color:var(--ink-black);line-height:1.8}
.b-qa .qa-q{font-size:1.65vh;color:var(--ink-red);font-weight:700;margin:1vh 0 .2vh}
.b-qa .qa-ans-label{color:var(--ink-blue);font-weight:700;margin-right:.5vw}
.b-qa .qa-a li{font-size:1.52vh;color:var(--ink-black);line-height:1.85;margin-left:2vw;list-style:none}
.b-qa .qa-a li::before{content:"– "}
.b-diagram{margin:1vh 0}
.b-diagram .dg-flow{display:flex;align-items:center;gap:.7vw;flex-wrap:wrap;font-size:1.42vh;color:#173e6b}
.b-diagram .dg-node{background:#fff;padding:.5vh 1.1vw;border:2px solid var(--ink-blue) !important}
.b-diagram .dg-arrow{color:var(--ink-red);font-weight:700;font-size:1.9vh}
.b-diagram-staged{border:2px dashed #8aa;padding:.7vh 1.2vw;margin:.8vh 0;font-size:1.4vh;color:#68a;background:var(--paper)}
.paper-texture{opacity:.25}
</style>
</head>
<body>
<div id="page">
  <div class="stamp" id="v-stamp"></div>
  <div class="head"><span id="v-date" data-jitter></span></div>
  <div class="series" id="v-series" data-jitter></div>
  <div class="page-title" id="v-ptitle" data-jitter></div>
  <div id="content"><!--CONTENT--></div>
  <div class="paper-texture"></div>
  <div class="vignette"></div>
</div>
<script src="../_shared/rough.min.js"></script>
<script src="../_shared/jitter.js"></script>
<!--PAGEVARS-->
<script>
  document.getElementById('v-stamp').textContent = PAGE.brand.toUpperCase() + ' · REV A';
  document.getElementById('v-date').textContent = PAGE.date;
  document.getElementById('v-series').textContent = PAGE.series;
  document.getElementById('v-ptitle').textContent = 'SPEC SHEET ' + String(PAGE.pageNum).padStart(2, '0') + ' — ' + PAGE.page_title;
  applyJitter(PAGE.seed + PAGE.pageNum);
</script>
</body>
</html>
