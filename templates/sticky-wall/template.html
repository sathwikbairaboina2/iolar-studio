<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
:root{--ink-blue:#2b4a6f;--ink-red:#b23a48;--ink-green:#2d6a4f;--ink-black:#3a3a3a;--ink-accent:#b23a48;--paper:#fff8b8}
body{font-family:'Patrick Hand',cursive;background:#a5814f}
#page{background:#b9936c;background-image:radial-gradient(rgba(0,0,0,.12) 1.4px,transparent 1.4px);
  background-size:.85vh .85vh;padding:11vh 4vw 4vh}
.title-card{position:absolute;top:2.6vh;left:16vw;right:16vw;background:#fff;padding:1vh;text-align:center;
  font-family:'Caveat',cursive;font-size:2.6vh;color:#333;font-weight:700;box-shadow:0 6px 14px rgba(0,0,0,.35);
  transform:rotate(-1deg);z-index:2}
.pin{width:1.6vh;height:1.6vh;border-radius:50%;background:#d33;position:absolute;top:-.7vh;left:48%;
  box-shadow:0 2px 4px rgba(0,0,0,.4)}
.subtitle{position:absolute;top:8.2vh;left:0;right:0;text-align:center;font-size:1.5vh;color:#f3e6cf;z-index:2}

#content{column-gap:1.8vw}
#content > *{display:block;margin-bottom:2vh !important;
  box-shadow:0 6px 14px rgba(0,0,0,.3);border:none !important;border-radius:2px}
/* sticky note palette rotation */
#content > *:nth-child(5n+1){background:#fff8b8;transform:rotate(-2deg)}
#content > *:nth-child(5n+2){background:#c9f2d0;transform:rotate(1.6deg)}
#content > *:nth-child(5n+3){background:#ffd6e0;transform:rotate(-1.2deg)}
#content > *:nth-child(5n+4){background:#cfe8ff;transform:rotate(2deg)}
#content > *:nth-child(5n+5){background:#ffe0b8;transform:rotate(-.8deg)}

.b-heading{font-family:'Caveat',cursive;font-size:2.2vh;font-weight:700;color:var(--ink-black);padding:1.2vh 1.4vw}
.b-paragraph{font-size:1.5vh;color:var(--ink-black);line-height:1.75;padding:1.2vh 1.4vw}
.b-bullets{padding:1.2vh 1.4vw 1.2vh 2.2vw}
.b-bullets li{font-size:1.48vh;color:var(--ink-black);line-height:1.8;list-style:none}
.b-bullets li::before{content:"• ";color:var(--ink-red)}
.b-sidebox{padding:1.2vh 1.4vw}
.b-sidebox .sb-title{font-family:'Caveat',cursive;font-size:1.9vh;font-weight:700;color:var(--ink-red);margin-bottom:.2vh}
.b-sidebox li{font-size:1.45vh;color:var(--ink-black);line-height:1.75;margin-left:1vw;list-style:none}
.b-sidebox li::before{content:"– "}
.b-table{width:100%;border-collapse:collapse;font-size:1.3vh;padding:0}
.b-table th{font-family:'Caveat',cursive;font-size:1.55vh;color:var(--ink-red)}
.b-table th,.b-table td{border:1.5px solid rgba(0,0,0,.35);padding:.4vh .7vw;text-align:center;color:var(--ink-black)}
.b-code{font-family:'JetBrains Mono',monospace;font-size:1.22vh;color:var(--ink-blue);line-height:1.7;
  white-space:pre-wrap;padding:1.2vh 1.4vw}
.b-callout{padding:1.2vh 1.4vw}
.b-callout .co-title{font-family:'Caveat',cursive;font-size:1.9vh;font-weight:700;color:var(--ink-red)}
.b-callout .co-text{font-size:1.45vh;color:var(--ink-black);line-height:1.75}
.b-qa{padding:1.2vh 1.4vw}
.b-qa .qa-q{font-size:1.6vh;color:var(--ink-red);font-weight:700;margin-bottom:.3vh}
.b-qa .qa-ans-label{color:var(--ink-green);font-weight:700;margin-right:.4vw}
.b-qa .qa-a li{font-size:1.45vh;color:var(--ink-black);line-height:1.75;margin-left:1.4vw;list-style:none}
.b-qa .qa-a li::before{content:"· "}
.b-qa .b-code{padding:.6vh 0 0}
.b-diagram{padding:1.2vh 1.4vw}
.b-diagram .dg-flow{display:flex;align-items:center;gap:.6vw;flex-wrap:wrap;font-size:1.35vh;color:var(--ink-black)}
.b-diagram .dg-node{background:rgba(255,255,255,.6);padding:.3vh .8vw}
.b-diagram .dg-arrow{color:var(--ink-red);font-weight:700}
.b-diagram-staged{padding:1.2vh 1.4vw;font-size:1.4vh;color:#776}
.paper-texture{opacity:.25}
.vignette{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.3) 100%)}
</style>
</head>
<body>
<div id="page">
  <div class="title-card"><span class="pin"></span><span id="v-series" data-jitter></span></div>
  <div class="subtitle" id="v-ptitle" data-jitter></div>
  <div id="content"><!--CONTENT--></div>
  <div class="paper-texture"></div>
  <div class="vignette"></div>
</div>
<script src="../_shared/rough.min.js"></script>
<script src="../_shared/pack.js"></script>
<script src="../_shared/layout.js"></script>
<script src="../_shared/diagrams.js"></script>
<script src="../_shared/jitter.js"></script>
<!--PAGEVARS-->
<script>
  document.getElementById('v-series').textContent = PAGE.series;
  document.getElementById('v-ptitle').textContent = PAGE.brand + ' · ' + PAGE.page_title + ' · ' + PAGE.pageNum + '/' + PAGE.pageCount;
  document.fonts.ready.then(function () {
    applyLayout({ columns: PAGE.columns, rowGapPx: PAGE.rowGapPx });
    applyJitter(PAGE.seed + PAGE.pageNum);
  });
</script>
</body>
</html>
