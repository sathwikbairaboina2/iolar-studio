<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
.ticket{background:#e9edf4}
.ticket .tk{position:absolute;left:44px;right:44px;top:44px;bottom:44px;background:#fff;border-radius:34px;display:flex;flex-direction:column;overflow:hidden}
.ticket .tkhead{background:var(--navy);color:#fff;padding:32px 44px;display:flex;align-items:center;gap:18px}
.ticket .tkhead .mark{width:64px;height:64px;border-radius:16px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-family:'Mont';font-weight:800;font-size:32px;overflow:hidden;flex:none}
.ticket .tkhead .mark img{width:100%;height:100%;object-fit:contain}
.ticket .tkhead .n{font-family:'Mont';font-weight:800;font-size:36px}
.ticket .tkhead .k{margin-left:auto;font-family:'Mont';font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.14em;opacity:.75}
.ticket .tkbody{padding:38px 44px 6px;flex:1;display:flex;flex-direction:column}
.ticket .role{font-family:'Mont';font-weight:800;font-size:62px;line-height:.98;text-transform:uppercase;color:var(--navy);letter-spacing:-.025em}
.ticket .co{font-size:27px;color:#5b6673;margin-top:14px}
.ticket .g{display:grid;grid-template-columns:1fr 1fr;gap:24px 36px;margin-top:32px}
.ticket .g .lab{font-family:'Mont';font-weight:700;font-size:21px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.ticket .g .val{font-size:28px;margin-top:7px;color:#1b2431;line-height:1.3}
.ticket .elig{margin:34px 0 0;font-size:24px;line-height:1.45;color:#3b4757;background:#f5f7fb;border-radius:18px;padding:24px 28px}
.ticket .perf{position:relative;border-top:5px dashed #d3dae6;margin:28px 0 0}
.ticket .perf:before,.ticket .perf:after{content:"";position:absolute;top:-36px;width:70px;height:70px;border-radius:50%;background:#e9edf4}
.ticket .perf:before{left:-79px}
.ticket .perf:after{right:-79px}
.ticket .stub{padding:30px 44px;display:flex;align-items:center;gap:34px}
.ticket .stub .lab{font-family:'Mont';font-weight:700;font-size:20px;color:#8a93a4;text-transform:uppercase;letter-spacing:.08em}
.ticket .stub .big{font-family:'Mont';font-weight:800;font-size:40px;color:var(--accent);margin-top:6px}
.ticket .stub .mid{font-family:'Mont';font-weight:800;font-size:30px;color:var(--navy);margin-top:6px}
.ticket .bars{margin-left:auto;width:200px;height:70px;background:repeating-linear-gradient(90deg,#141b26 0 5px,#fff 5px 9px,#141b26 9px 13px,#fff 13px 19px)}
.ticket .cta{background:var(--accent);color:#fff;padding:24px 44px;font-size:25px;display:flex;align-items:center;gap:16px}
.ticket .cta svg{width:38px;height:38px;fill:#fff;flex:none}
.ticket .cta .hi{color:var(--yellow);font-weight:700}
</style>
</head>
<body>
<!--CARD-->
</body>
</html>
