<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
.campaign{background:linear-gradient(135deg,#fff 62%,#f3ecfb 100%)}
.campaign .pad{padding-bottom:176px}
.campaign .head{font-size:72px;margin:14px 0 16px}
.campaign .tag{display:inline-block;background:linear-gradient(90deg,var(--navy),var(--accent));color:#fff;font-family:'Mont';font-weight:700;font-size:29px;padding:15px 26px;border-radius:12px}
.campaign .lede{font-size:24px;color:#42506b;margin-top:14px}
.campaign .vis{position:absolute;top:120px;right:56px;width:310px;height:230px;border-radius:20px;background:#fff;border:2px solid #e2e7f0;box-shadow:0 18px 40px rgba(20,30,60,.12);padding:26px}
.campaign .vis .t{font-family:'Mont';font-weight:800;font-size:26px;color:var(--navy);margin-bottom:16px}
.campaign .vis .ck{display:flex;gap:14px;align-items:center;font-size:23px;color:#2a3442;margin-bottom:12px}
.campaign .vis .ck i{width:26px;height:26px;border:3px solid var(--accent);border-radius:6px;display:block;flex:none}
.campaign .dates{display:flex;border:2px solid #e2e7f0;border-radius:20px;overflow:hidden;margin:26px 0}
.campaign .dates .c{flex:1;display:flex;gap:20px;align-items:center;padding:22px 26px}
.campaign .dates .c + .c{border-left:2px solid #e2e7f0}
.campaign .dates .lab{font-family:'Mont';font-weight:800;font-size:24px;color:var(--accent);text-transform:uppercase}
.campaign .dates .val{font-size:29px;font-weight:700;margin-top:6px}
.campaign .dates .val small{display:block;font-weight:400;font-size:21px;color:#6b7788;margin-top:4px}
.campaign .panels{display:flex;gap:28px}
.campaign .panel{flex:1;border:2px solid #e2e7f0;border-radius:20px;overflow:hidden;background:#fff}
.campaign .panel .ph{background:var(--navy);color:#fff;font-family:'Mont';font-weight:800;font-size:26px;text-transform:uppercase;text-align:center;padding:16px}
.campaign .panel.alt .ph{background:var(--accent)}
.campaign .panel .body{padding:26px 24px}
.campaign .erow{display:flex;gap:18px;align-items:flex-start;padding:13px 0}
.campaign .erow + .erow{border-top:2px solid #eef1f6}
.campaign .erow .coin{width:60px;height:60px}
.campaign .erow .coin svg{width:30px;height:30px}
.campaign .erow .n{font-family:'Mont';font-weight:800;font-size:24px;color:var(--navy)}
.campaign .erow .d{font-size:21px;color:#4a5666;line-height:1.4;margin-top:5px}
.campaign .num{width:60px;height:60px;border-radius:50%;color:#fff;font-family:'Mont';font-weight:800;font-size:29px;display:flex;align-items:center;justify-content:center;flex:none}
.campaign .money{display:flex;gap:22px;align-items:center;background:#f7f4fd;border-radius:20px;padding:22px 28px;margin-top:24px}
.campaign .money .lab{font-family:'Mont';font-weight:800;font-size:23px;color:var(--accent);text-transform:uppercase}
.campaign .money .big{font-family:'Mont';font-weight:800;font-size:38px;color:var(--navy);margin-top:5px}
.campaign .money .note{font-size:19px;color:#7b8798;margin-top:4px}
.campaign .money .sk{margin-left:auto;text-align:right;max-width:420px}
.campaign .money .sk .lab{color:var(--navy)}
.campaign .money .sk .v{font-size:22px;color:#3b4757;line-height:1.4;margin-top:6px}
</style>
</head>
<body>
<!--CARD-->
</body>
</html>
