<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
.campaign .pad{padding-bottom:156px;min-height:100%;display:flex;flex-direction:column}
.campaign .head{font-size:72px;margin:14px 0 16px}
.campaign .tag{display:inline-block;background:var(--grad);color:#fff;font-family:'Mont';font-weight:700;font-size:29px;padding:15px 26px;border-radius:12px}
.campaign .lede{font-size:24px;color:#4b4363;margin-top:14px}
.campaign .dates{display:flex;border:2px solid #e6def3;border-radius:20px;overflow:hidden;margin:26px 0 0}
.campaign .dates .c{flex:1;display:flex;gap:20px;align-items:center;padding:22px 26px}
.campaign .dates .c + .c{border-left:2px solid #e6def3}
.campaign .dates .lab{font-family:'Mont';font-weight:800;font-size:24px;color:var(--accent);text-transform:uppercase}
.campaign .dates .val{font-size:29px;font-weight:700;margin-top:6px}
.campaign .dates .val small{display:block;font-weight:400;font-size:21px;color:#7a7192;margin-top:4px}
.campaign .panels{display:flex;gap:28px;margin-top:26px;flex:1}
.campaign .panel{flex:1;border:2px solid #e6def3;border-radius:20px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.campaign .panel .ph{background:var(--deep);color:#fff;font-family:'Mont';font-weight:800;font-size:26px;text-transform:uppercase;text-align:center;padding:16px}
.campaign .panel.alt .ph{background:var(--grad)}
.campaign .panel .body{padding:26px 24px;flex:1;display:flex;flex-direction:column}
.campaign .erow{display:flex;gap:18px;align-items:center;padding:13px 0;flex:1}
.campaign .erow + .erow{border-top:2px solid #f1ecf9}
.campaign .erow .coin{width:60px;height:60px}
.campaign .erow .coin svg{width:30px;height:30px}
.campaign .erow .n{font-family:'Mont';font-weight:800;font-size:24px;color:var(--navy)}
.campaign .erow .d{font-size:21px;color:#4b4363;line-height:1.4;margin-top:5px}
.campaign .num{width:60px;height:60px;border-radius:50%;color:#fff;font-family:'Mont';font-weight:800;font-size:29px;display:flex;align-items:center;justify-content:center;flex:none}
.campaign .glance{display:flex;border:2px solid #e6def3;border-radius:20px;overflow:hidden;margin:26px 0 0;background:#fff}
.campaign .glance .g{flex:1;text-align:center;padding:24px 12px}
.campaign .glance .g + .g{border-left:2px solid #e6def3}
.campaign .glance .coin{margin:0 auto 14px}
.campaign .glance .lab{font-family:'Mont';font-weight:800;font-size:21px;color:var(--accent);text-transform:uppercase}
.campaign .glance .val{font-size:25px;font-weight:700;margin-top:6px;line-height:1.3}
.campaign .roomy .head{font-size:128px;margin:26px 0 26px}
.campaign .roomy .tag{font-size:40px;padding:20px 32px}
.campaign .roomy .lede{font-size:32px;margin-top:20px}
.campaign .roomy .glance .g{padding:40px 12px}
.campaign .roomy .glance .coin{width:88px;height:88px}
.campaign .roomy .glance .coin svg{width:44px;height:44px}
.campaign .roomy .glance .lab{font-size:23px}
.campaign .roomy .glance .val{font-size:31px}
.campaign .roomy .panel .body{padding:34px 28px}
.campaign .roomy .erow .coin,.campaign .roomy .num{width:88px;height:88px}
.campaign .roomy .erow .coin svg{width:44px;height:44px}
.campaign .roomy .erow .n{font-size:36px}
.campaign .roomy .erow .d{font-size:25px}
.campaign .mid .head{font-size:116px;margin:22px 0 22px}
.campaign .mid .tag{font-size:36px;padding:18px 30px}
.campaign .mid .lede{font-size:27px}
.campaign .mid .glance .g{padding:42px 12px}
.campaign .mid .glance .coin{width:72px;height:72px}
.campaign .mid .glance .coin svg{width:36px;height:36px}
.campaign .mid .glance .val{font-size:27px}
.campaign .mid .erow .n{font-size:27px}
.campaign .mid .erow .d{font-size:22px}
.campaign .money{display:flex;gap:22px;align-items:center;background:#f7f4fd;border-radius:20px;padding:22px 28px;margin-top:24px}
.campaign .money .lab{font-family:'Mont';font-weight:800;font-size:23px;color:var(--accent);text-transform:uppercase}
.campaign .money .big{font-family:'Mont';font-weight:800;font-size:38px;color:var(--navy);margin-top:5px}
.campaign .money .note{font-size:19px;color:#7a7192;margin-top:4px}
.campaign .money .sk{margin-left:auto;text-align:right;max-width:420px}
.campaign .money .sk .lab{color:var(--navy)}
.campaign .money .sk .v{font-size:22px;color:#4b4363;line-height:1.4;margin-top:6px}
</style>
</head>
<body>
<!--CARD-->
</body>
</html>
