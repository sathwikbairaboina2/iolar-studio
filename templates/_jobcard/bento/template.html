<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
.bento{background:#f2f5fa}
.bento .pad{padding:48px 48px 190px}
.bento .bar{display:flex;align-items:center;margin-bottom:24px}
.bento .bar .tag{margin-left:auto;background:#fff;border-radius:999px;padding:12px 26px;font-family:'Mont';font-weight:700;font-size:24px;color:#7b8798}
.bento .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.bento .t{background:#fff;border-radius:26px;padding:26px 28px}
.bento .t.hero{grid-column:span 3;background:var(--accent);color:#fff;padding:36px 34px}
.bento .t.hero .r{font-family:'Mont';font-weight:800;font-size:58px;line-height:.98;text-transform:uppercase;letter-spacing:-.025em}
.bento .t.hero .c{font-size:26px;opacity:.92;margin-top:14px}
.bento .t .lab{font-family:'Mont';font-weight:700;font-size:21px;color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.bento .t .val{font-size:29px;font-weight:600;margin-top:7px;line-height:1.24;color:#1b2431}
.bento .t.wide{grid-column:span 3}
.bento .t .coin{width:56px;height:56px;margin-bottom:14px}
.bento .t .coin svg{width:28px;height:28px}
.bento .t .p{font-size:25px;line-height:1.45;color:#2a3442;margin-top:9px}
.bento .chips{margin-top:13px}
</style>
</head>
<body>
<!--CARD-->
</body>
</html>
