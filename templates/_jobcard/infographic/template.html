<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
.infographic .pad{padding-bottom:160px;min-height:100%;display:flex;flex-direction:column}
.infographic .top{display:flex;align-items:flex-start;gap:34px;margin-bottom:26px}
.infographic .top .logo .word{font-size:36px}
.infographic .head{font-size:66px;margin-bottom:6px}
.infographic .head.sm{font-size:54px}
.infographic .bubble{position:relative;background:var(--grad);color:#fff;font-family:'Mont';font-weight:800;font-size:24px;line-height:1.2;text-transform:uppercase;text-align:center;padding:14px 22px;border-radius:16px;width:330px;flex:none;margin-left:auto;margin-top:52px}
.infographic .bubble:after{content:"";position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);border:18px solid transparent;border-top-color:#a243b0;border-bottom:0}
.infographic .ribbon{margin-top:22px}
.infographic .strip{display:flex;margin:0 0 22px;flex:.35}
.infographic .strip .c{flex:1;text-align:center;padding:0 12px;display:flex;flex-direction:column;justify-content:center}
.infographic .strip .c + .c{border-left:2px solid #e9e2f4}
.infographic .strip .coin{margin:0 auto 16px;flex:none}
.infographic .strip .lab{font-family:'Mont';font-weight:700;font-size:23px;color:var(--accent);text-transform:uppercase;letter-spacing:.02em}
.infographic .strip .val{font-size:25px;margin-top:8px;line-height:1.3;color:#1b1530}
.infographic .rows{display:flex;flex-direction:column;flex:2}
.infographic .rrow{display:flex;gap:26px;align-items:center;padding:14px 0;flex:1}
.infographic .rrow + .rrow{border-top:2px solid #f1ecf9}
.infographic .rrow .left{width:250px;flex:none}
.infographic .rrow .name{font-family:'Mont';font-weight:800;font-size:31px;text-transform:uppercase;letter-spacing:.01em}
.infographic .rrow .sub{font-size:22px;color:#4b4363;margin-top:6px}
.infographic .rrow .bul{flex:1;border-left:2px solid #e9e2f4;padding-left:26px;font-size:23px;line-height:1.5;color:#3a3150}
.infographic .rrow ul{margin:0;padding-left:22px}
.infographic .rrow li{margin:0 0 4px}
.infographic .rrow .chips{gap:10px}
.infographic .rrow .chip{font-size:22px;padding:8px 18px}
</style>
</head>
<body>
<!--CARD-->
</body>
</html>
