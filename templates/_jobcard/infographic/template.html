<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
.infographic .top{display:flex;align-items:flex-start;gap:34px;margin-bottom:26px}
.infographic .head{font-size:66px}
.infographic .bubble{position:relative;background:var(--accent);color:#fff;font-family:'Mont';font-weight:800;font-size:27px;line-height:1.2;text-transform:uppercase;text-align:center;padding:20px 24px;border-radius:16px;width:250px;flex:none;margin-left:auto}
.infographic .bubble:after{content:"";position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);border:20px solid transparent;border-top-color:var(--accent);border-bottom:0}
.infographic .strip{display:flex;margin:0 0 30px}
.infographic .strip .c{flex:1;text-align:center;padding:0 12px}
.infographic .strip .c + .c{border-left:2px solid #e7ebf2}
.infographic .strip .coin{margin:0 auto 16px}
.infographic .strip .lab{font-family:'Mont';font-weight:700;font-size:23px;color:var(--accent);text-transform:uppercase;letter-spacing:.02em}
.infographic .strip .val{font-size:25px;margin-top:8px;line-height:1.3;color:#1b2431}
.infographic .rrow{display:flex;gap:26px;align-items:flex-start;padding:19px 0}
.infographic .rrow + .rrow{border-top:2px solid #eef1f6}
.infographic .rrow .left{width:400px;flex:none}
.infographic .rrow .name{font-family:'Mont';font-weight:800;font-size:31px;text-transform:uppercase;letter-spacing:.01em}
.infographic .rrow .sub{font-size:24px;color:#48566a;margin-top:7px}
.infographic .rrow .bul{flex:1;border-left:2px solid #e7ebf2;padding-left:30px;font-size:23px;line-height:1.55;color:#2a3442}
.infographic .rrow ul{margin:0;padding-left:22px}
.infographic .rrow li{margin:0 0 4px}
.infographic .notice{display:flex;align-items:center;gap:20px;background:#f3f0fa;border-radius:16px;padding:18px 26px;margin-top:6px}
.infographic .notice .k{font-family:'Mont';font-weight:800;font-size:24px;color:var(--accent);text-transform:uppercase}
.infographic .notice .v{font-size:23px;color:#2a3442;margin-top:4px}
.infographic .notice .tagbox{margin-left:auto;background:#fff;border-radius:12px;padding:12px 26px;font-family:'Mont';font-weight:700;font-size:28px;color:#8a93a4}
</style>
</head>
<body>
<!--CARD-->
</body>
</html>
