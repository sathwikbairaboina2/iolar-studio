<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
.band-stack{background:#fff;display:flex;flex-direction:column}
.band-stack .b-head{background:var(--accent);color:#fff;padding:50px 56px}
.band-stack .b-head .mark{background:#fff;color:var(--accent)}
.band-stack .b-head .word{color:#fff}
.band-stack .b-head .h{font-family:'Mont';font-weight:800;font-size:66px;line-height:.98;text-transform:uppercase;letter-spacing:-.025em;margin-top:24px}
.band-stack .b-head .s{font-size:26px;opacity:.92;margin-top:14px}
.band-stack .band{display:flex;gap:30px;padding:32px 56px;align-items:flex-start}
.band-stack .band + .band{border-top:2px solid #eaeef4}
.band-stack .band .k{width:260px;flex:none;font-family:'Mont';font-weight:800;font-size:25px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);padding-top:4px}
.band-stack .band .v{flex:1;font-size:28px;line-height:1.35;color:#1b2431}
.band-stack .band .v small{display:block;font-size:23px;color:#5b6673;margin-top:6px;font-weight:400}
.band-stack .b-tint{background:#f6f4fc}
.band-stack .b-money .v{font-family:'Mont';font-weight:800;font-size:42px;color:var(--navy)}
.band-stack .b-dark{background:var(--navy);color:#fff;margin-top:auto}
.band-stack .b-dark .k{color:var(--yellow)}
.band-stack .b-dark .v{color:#fff}
.band-stack .steps{display:flex;gap:12px;flex-wrap:wrap}
.band-stack .step{background:#fff;border:2px solid #e2e7f0;border-radius:999px;padding:9px 20px;font-size:22px;font-weight:600;color:#2a3442}
</style>
</head>
<body>
<!--CARD-->
</body>
</html>
