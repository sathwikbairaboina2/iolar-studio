<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
:root{--ink-blue:#2a4aa0;--ink-red:#d9381e;--ink-green:#2e8b57;--ink-black:#1b1f3b;--ink-accent:#d9381e;--ink-purple:#6a4fb3;--ink-orange:#e07a1f;--ink-pink:#d6407f;
  --paper:#fffdf6;--hl:#ffe94d;--on-yellow:#1b1f3b;--rule:#6c7aa8;--sticky:#fff3a0;--sticky-pink:#ffd3e1;
  --table-head:color-mix(in srgb,var(--ink-blue) 17%,#fffdf6)}
body{font-family:'Patrick Hand',cursive;background:#e6e1d4}
/* Lined paper, warm and faint; the rings and their punched holes run down the left edge. */
#page{background:repeating-linear-gradient(#fbf8ef,#fbf8ef calc(3.4vh - 1px),#e4e9f1 3.4vh);
  padding:2vh 3vw 2vh 5.6vw;color:var(--ink-black)}
.spiral{position:absolute;left:0;top:0;bottom:0;width:3.9vw;z-index:2;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 50' preserveAspectRatio='none'><circle cx='50' cy='25' r='4' fill='%23d9d2c1'/><rect x='-4' y='15' width='46' height='19' rx='9.5' fill='%2328282f' transform='rotate(-4 20 25)'/><rect x='0' y='19' width='38' height='3' rx='1.5' fill='%23777783' transform='rotate(-4 20 25)'/></svg>") repeat-y;
  background-size:100% 3.4vh}

/* ── chrome ── */
.head{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.head .brand{font-family:'Caveat',cursive;font-weight:700;font-size:2.7vh;color:var(--ink-black);padding:0 .8vw;
  background:linear-gradient(transparent 62%,color-mix(in srgb,var(--ink-pink) 38%,transparent) 62%,color-mix(in srgb,var(--ink-pink) 38%,transparent) 94%,transparent 94%)}
.head .badge{font-family:'Patrick Hand',cursive;font-size:2.1vh;color:var(--ink-black);letter-spacing:.02em;white-space:nowrap}
.head .badge b{font-weight:400;color:var(--ink-red)}
.aside{position:absolute;right:3.6vw;top:6.2vh;z-index:2;max-width:15vw;text-align:right;font-family:'Caveat',cursive;font-weight:700;
  font-size:2.35vh;line-height:1.05;color:var(--ink-blue);transform:rotate(3.5deg);transform-origin:right top}
.aside:empty{display:none}
.aside::after{content:"";display:block;height:.5vh;margin-top:.3vh;border-bottom:2.5px solid var(--ink-blue);border-radius:50%;transform:rotate(-2deg)}

.title{position:relative;z-index:1;text-align:center;margin:.6vh 0 1vh;padding:0 13vw}
.title-band{display:inline-block;position:relative;white-space:nowrap;padding:.1vh 2vw .3vh;font-family:'Gochi Hand',cursive;
  font-size:5.2vh;line-height:1.02;color:var(--ink-black);z-index:0}
/* A translucent marker swipe a little off the straight, with ragged ends. */
.title-band::before{content:"";position:absolute;inset:.5vh 0 .2vh;z-index:-1;background:color-mix(in srgb,var(--hl) 78%,transparent);transform:rotate(-.7deg);
  clip-path:polygon(0 12%,3% 0,22% 6%,48% 0,76% 5%,97% 0,100% 18%,98% 52%,100% 88%,95% 100%,70% 94%,40% 100%,14% 95%,2% 100%,0 70%,2% 40%)}
.title .subtitle{display:block;font-family:'Kalam',cursive;font-size:2.3vh;color:var(--ink-black);margin-top:.2vh;line-height:1.15}
.title .subtitle:empty{display:none}
#page.has-concept .title,#page.cover-page .title{display:none}
#page.has-hero .title{padding-right:14vw}
#page.has-aside .title{padding-left:17vw;padding-right:17vw}
/* The corner holds one thing, as on the reference pages: a hand note or a logo. The note wins;
   a hero squeezed in beside it collided with the title. */
#page.has-aside.has-hero #v-hero{display:none}
#v-hero{top:8.5vh;color:var(--ink-blue)}

/* Panels: a light fill of the block's ink and a thin solid border. The rough dashed frame stays off. */
#page .b-frame,#page .b-sidebox,#page .b-callout:not(.co-sticky):not(.co-banner){--fr:var(--ink-blue);
  background:color-mix(in srgb,var(--fr) 13%,var(--paper));border:1.6px solid color-mix(in srgb,var(--fr) 62%,transparent);
  border-radius:1.1vh 1.5vh 1.2vh 1.4vh;padding:.55vh 1.1vw;margin:.35vh 0}
[data-rough="var(--ink-blue)"]{--fr:var(--ink-blue)}
[data-rough="var(--ink-red)"],[data-rough="var(--ink-accent)"]{--fr:var(--ink-red)}
[data-rough="var(--ink-green)"]{--fr:var(--ink-green)}
[data-rough="var(--ink-black)"]{--fr:var(--ink-black)}
[data-rough="var(--ink-purple)"]{--fr:var(--ink-purple)}
[data-rough="var(--ink-orange)"]{--fr:var(--ink-orange)}
[data-rough="var(--ink-pink)"]{--fr:var(--ink-pink)}
#page .b-frame>svg,#page .b-sidebox>svg,#page .b-callout>svg{display:none}

/* ── headings: marker face on a highlighter band, the number in red ── */
#page .b-heading{--band:var(--hl);display:block;width:fit-content;max-width:100%;font-family:'Gochi Hand',cursive;font-size:2.45vh;line-height:1.1;color:var(--ink-black);
  text-transform:none;letter-spacing:0;margin:.6vh 0 .25vh;padding:.05vh 1.1vw .15vh;border-radius:1vh .7vh 1.2vh .6vh;
  background:color-mix(in srgb,var(--band) 46%,transparent);transform:rotate(-.5deg)}
#page .b-heading::before{content:none}
#page .b-heading.ink-blue{--band:color-mix(in srgb,var(--ink-blue) 62%,transparent)}
#page .b-heading.ink-red,#page .b-heading.ink-accent{--band:var(--ink-pink)}
#page .b-heading.ink-green{--band:color-mix(in srgb,var(--ink-green) 75%,transparent)}
#page .b-heading.ink-black{--band:#9aa0b8}
#page .b-heading.ink-purple{--band:color-mix(in srgb,var(--ink-purple) 62%,transparent)}
#page .b-heading.ink-orange{--band:var(--ink-orange)}
#page .b-heading.ink-pink{--band:var(--ink-pink)}
#page .b-heading.ink-blue,#page .b-heading.ink-red,#page .b-heading.ink-green,#page .b-heading.ink-black,#page .b-heading.ink-accent,#page .b-heading.ink-purple,#page .b-heading.ink-orange,#page .b-heading.ink-pink{color:var(--ink-black)}
#page .b-heading:not([class*="ink-"]){--band:var(--hl);background:color-mix(in srgb,var(--hl) 78%,transparent)}
.hd-num{color:var(--ink-red)}
/* Ribbon: the outer element draws the outline round the notched fill. */
#page .b-heading.hd-ribbon{background:none;padding:0;border-radius:0;transform:none;margin:1vh 0 .5vh;
  filter:drop-shadow(1.6px 0 0 var(--ink-red)) drop-shadow(-1.6px 0 0 var(--ink-red)) drop-shadow(0 1.6px 0 var(--ink-red)) drop-shadow(0 -1.6px 0 var(--ink-red))}
.hd-ribbon-in{display:block;padding:.55vh 3.4vw;font-family:'Patrick Hand',cursive;font-size:2.4vh;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-black);
  background:color-mix(in srgb,var(--ink-red) 16%,var(--paper));
  clip-path:polygon(0 0,100% 0,calc(100% - 1.3vw) 50%,100% 100%,0 100%,1.3vw 50%)}

/* ── text ── */
#page .b-paragraph{font-size:1.72vh;line-height:1.38;color:var(--ink-black);margin:.2vh 0}
#page .b-bullets{margin:.15vh 0 .15vh .6vw}
#page .b-bullets li{font-size:1.68vh;line-height:1.38;color:var(--ink-black);list-style:none;padding-left:1.1em;text-indent:-1.1em}
#page .b-bullets li::before{content:"• ";color:var(--ink-blue);font-weight:700}
#page .b-bullets.bl-number li::before,#page .b-bullets.bl-check li::before,#page .b-bullets.bl-cross li::before,#page .b-bullets.bl-checkbox li::before,#page .b-bullets.bl-star li::before{content:""}
#page .b-bullets.bl-check li::before{content:"✓ ";color:var(--ink-green)}
#page .b-bullets.bl-cross li::before{content:"✗ ";color:var(--ink-red)}
#page .b-bullets.bl-checkbox li::before{content:"☑ ";color:var(--ink-green)}
#page .b-bullets.bl-star li::before{content:"☆ ";color:var(--ink-purple)}
.b-sidebox .sb-title{font-family:'Caveat',cursive;font-weight:700;font-size:2.4vh;color:var(--fr);text-decoration:none;margin-bottom:.15vh}
#page .b-sidebox li{font-size:1.64vh;line-height:1.38;color:var(--ink-black);margin-left:.9vw;list-style:none;padding-left:1.1em;text-indent:-1.1em}
#page .b-sidebox li::before{content:"• ";color:var(--fr);font-weight:700}
/* The hanging indent must not reach the per-character spans jitter wraps, or every letter shifts left. */
#page li *{text-indent:0}
#page .b-frame>.b-bullets,#page .b-frame>.b-paragraph,#page .b-frame>.b-table{margin:0}

/* ── tables: coloured header row, light striping, readable rules ── */
#page .b-table{width:100%;border-collapse:separate;border-spacing:0;font-size:1.6vh;background:var(--paper);margin:.5vh 0;
  border:1.6px solid color-mix(in srgb,var(--ink-blue) 55%,transparent);border-radius:.9vh;overflow:hidden}
#page .b-table th{font-family:'Caveat',cursive;font-weight:700;font-size:2.05vh;text-decoration:none;color:var(--ink-black);background:var(--table-head);padding:.2vh .7vw}
#page .b-table th,#page .b-table td{text-align:left;border:0;border-bottom:1.2px solid color-mix(in srgb,var(--ink-blue) 30%,transparent);
  border-right:1.2px solid color-mix(in srgb,var(--ink-blue) 24%,transparent);padding:.14vh .7vw;line-height:1.25;color:var(--ink-black)}
#page .b-table th:last-child,#page .b-table td:last-child{border-right:0}
#page .b-table tr:last-child td{border-bottom:0}
#page .b-table tr:nth-child(even) td{background:color-mix(in srgb,var(--ink-blue) 5%,var(--paper))}
#page .b-table tr.hl-row td{background:var(--hl);color:var(--on-yellow)}
#page .b-table.tb-mini{font-size:1.3vh;margin:.2vh 0}
#page .b-table.tb-mini th{font-size:1.5vh}
#page .b-table.tb-mini th,#page .b-table.tb-mini td{padding:.1vh .4vw}
#page .b-frame>.b-table{border-color:color-mix(in srgb,var(--fr) 55%,transparent)}

/* ── code: a light-blue box, hand face ── */
#page.code-hand .b-code{font-family:'Patrick Hand',cursive;font-size:1.55vh;letter-spacing:.02em;line-height:1.38;color:var(--ink-black);
  background:#e7f0fb;border:1.6px solid #7ea6d8;border-radius:1.1vh 1.4vh 1.2vh 1.3vh;padding:.5vh 1vw;margin:.4vh 0}
#page.code-hand .b-code.code-small{font-size:1.3vh}
#page.code-hand .b-code.code-tiny{font-size:1.12vh}
.tk-kw{color:#5b3fa0}.tk-fn{color:#2a4aa0}.tk-str{color:#c0392b}.tk-cm{color:#2e7d32}.tk-num{color:#b45f06}
#page .code-with-result>.b-code{margin:0}
#page .code-result{width:auto;font-size:1.45vh;margin:0;border-color:color-mix(in srgb,var(--ink-green) 55%,transparent)}
#page .code-result th{background:color-mix(in srgb,var(--ink-green) 20%,var(--paper));font-size:1.7vh}
#page .code-result tr:nth-child(even) td{background:color-mix(in srgb,var(--ink-green) 6%,var(--paper))}
#page .code-with-result{gap:.5vh 1vw}

/* ── callouts ── */
#page .b-callout:not(.co-sticky):not(.co-banner){--fr:var(--ink-red)}
#page .b-callout.co-cloud{--fr:var(--ink-pink);border-radius:2.4vh;text-align:left}
#page .b-callout .co-title{font-family:'Caveat',cursive;font-weight:700;font-size:2.4vh;color:var(--fr,var(--ink-red));text-decoration:none}
#page .b-callout.co-cloud .co-title{color:var(--ink-pink)}
#page .b-callout .co-text{font-size:1.64vh;line-height:1.38;color:var(--ink-black)}
#page .b-callout.co-sticky .co-title{color:var(--on-yellow)}
#page .b-callout.co-banner{background:color-mix(in srgb,var(--ink-red) 6%,var(--paper));border:1.8px solid var(--ink-red);border-radius:1.5vh;
  padding:.9vh 1.5vw;margin:.7vh 0;gap:1.5vw}
.co-bulb .ic{color:var(--ink-orange);width:5vh;height:5vh}
.co-banner-body{border-left:2px solid var(--ink-red);padding-left:1.5vw;flex:1;min-width:0}
#page .b-callout.co-banner .co-title{font-family:'Patrick Hand',cursive;font-size:2.1vh;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-black);margin-bottom:.2vh}
#page .b-callout.co-banner .co-title mark.hl{background:color-mix(in srgb,var(--hl) 85%,transparent);padding:.1vh .9vw;border-radius:.5vh}
#page .b-callout.co-banner .co-text{font-size:1.78vh}

/* ── Q&A: red badge, the question on a yellow band, bullets under it ── */
#page .b-qa .qa-q{display:flex;align-items:center;gap:.9vw;margin:.9vh 0 .3vh;color:var(--ink-black);font-weight:400}
.qa-badge{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:4.4vh;height:4.4vh;padding:0 .35vw;border:2px solid var(--ink-red);border-radius:50%;
  background:color-mix(in srgb,var(--ink-red) 11%,var(--paper));font-family:'Caveat',cursive;font-weight:700;font-size:2.4vh;color:var(--ink-red)}
.qa-text{font-family:'Caveat',cursive;font-weight:700;font-size:2.3vh;line-height:1.15;color:var(--ink-black);padding:.1vh .8vw;border-radius:.7vh;
  background:color-mix(in srgb,var(--hl) 78%,transparent);-webkit-box-decoration-break:clone;box-decoration-break:clone}
#page .b-qa .qa-a li{font-size:1.68vh;line-height:1.38;color:var(--ink-black);margin-left:1.2vw;list-style:none;padding-left:1.1em;text-indent:-1.1em}
#page .b-qa .qa-a li::before{content:"• ";color:var(--ink-blue);font-weight:700}
#page .b-qa .b-code{margin:.4vh 0}

/* ── concept and label rows ── */
#page .b-concept{display:flex;align-items:center;gap:2.4vw;margin:.6vh 0 1vh;padding-top:.4vh}
#page .cn-num{position:relative;font-family:'Caveat',cursive;font-weight:700;font-size:13vh;line-height:.95;color:var(--ink-red);padding-bottom:1.4vh;flex:none}
#page .cn-num::after{content:"";position:absolute;left:2%;right:-4%;bottom:.5vh;height:.9vh;border-radius:1vh;background:var(--ink-red);transform:rotate(-1.5deg)}
#page .cn-body{flex:1;min-width:0;position:relative}
#page .cn-title{display:inline-block;max-width:100%;font-family:'Gochi Hand',cursive;font-size:6.6vh;line-height:1.05;color:var(--ink-black);
  padding:.2vh 1.8vw .5vh;border-radius:1.4vh 1vh 1.6vh .8vh;background:color-mix(in srgb,var(--ink-pink) 28%,transparent);transform:rotate(-.8deg)}
#page .cn-tagline{position:absolute;right:0;bottom:-1.2vh;font-family:'Caveat',cursive;font-weight:700;font-size:2.5vh;line-height:1.05;color:var(--ink-blue);
  transform:rotate(-3deg);max-width:30%;text-align:right}
#page .b-labelrows{gap:1.3vh;margin:.4vh 0 .6vh}
#page .lr-row{gap:1.6vw}
#page .lr-icon{width:6vh;height:6vh;border:2.2px solid var(--ink-red);background:var(--paper)}
#page .lr-icon .ic{width:3.5vh;height:3.5vh;color:var(--ink-blue)}
#page .lr-body{flex:1;min-width:0;line-height:1.3}
#page .lr-label{font-family:'Caveat',cursive;font-weight:700;font-size:3.3vh;color:var(--ink-red);margin-right:1.1vw}
#page .lr-text{font-size:2.15vh;line-height:1.3;color:var(--ink-black)}

/* ── diagrams ── */
#page .b-diagram{margin:.5vh 0}
#page .dg-chain{gap:1vh}
#page .b-diagram .dg-flow{display:flex;align-items:center;gap:.8vw;flex-wrap:wrap;font-size:1.6vh;color:var(--ink-black)}
#page .b-diagram .dg-node{background:var(--paper);padding:.4vh 1vw}
#page .b-diagram .dg-arrow{color:var(--ink-red);font-weight:700;font-size:2vh}
.fc-node{font-size:1.5vh;line-height:1.25}
.card-title,.tb-title,.sc-name,.fc-title,.ch-title{font-weight:700}
.tb-title{color:var(--ink-green)}.fc-title{color:var(--ink-blue)}

/* ── cover: two-tone marker title, ticked promises, a flow of icons ── */
#page.cover-page #content{justify-content:flex-start}
#page .cover{display:grid;grid-template-columns:1fr 1fr;row-gap:1.4vh;align-content:start;align-items:center;padding:.5vh 0;justify-items:center;height:auto}
#page .cover>*{grid-column:1/-1}
.cover-title{grid-row:1}.cover-sub{grid-row:2}.cover-tagline{grid-row:3}.cover-pills{grid-row:4}.cover-logo{grid-row:4}.cover-icons{grid-row:5}
.cover-title{font-family:'Gochi Hand',cursive;font-size:9.4vh;line-height:1.02;text-transform:none;letter-spacing:0;color:var(--ink-black);text-align:center;margin-top:5.6vh}
.cover-title .ct-a{display:inline-block;padding:0 1.8vw .4vh;color:var(--ink-black);border-radius:1.2vh;background:color-mix(in srgb,var(--ink-orange) 34%,transparent);transform:rotate(-.6deg)}
.cover-title .ct-b{display:inline-block;margin-top:.6vh;color:var(--ink-red);padding:0 1.4vw;background:linear-gradient(transparent 76%,color-mix(in srgb,var(--hl) 92%,transparent) 76%,color-mix(in srgb,var(--hl) 92%,transparent) 94%,transparent 94%)}
.cover-sub{font-family:'Gochi Hand',cursive;font-size:5.2vh;text-transform:none;letter-spacing:0;color:var(--ink-black);text-align:center;line-height:1.05}
#page .cover-tagline{font-size:3vh;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-black);padding:.9vh 3vw;margin:.6vh 0;
  border:2.2px solid var(--ink-red);border-radius:1.5vh;background:color-mix(in srgb,var(--ink-red) 11%,var(--paper));max-width:80%}
#page .cover-tagline>svg,#page .cover-pills>svg{display:none}
#page .cover-pills{display:flex;flex-direction:column;align-items:flex-start;gap:1.1vh;background:none;padding:0 0 0 1vw;text-transform:none;letter-spacing:0;justify-self:stretch;
  grid-column:1/-1}
#page .cover:has(.cover-logo) .cover-pills{grid-column:1/2}
#page .cover-tagline.long{font-size:2.4vh;letter-spacing:.02em;text-transform:none}
.cover-pills>span:not(.cover-dot){position:relative;font-size:2.7vh;line-height:1.15;color:var(--ink-black);padding:0 .6vw .2vh 4.8vh;
  background:linear-gradient(transparent 84%,color-mix(in srgb,var(--ink-orange) 52%,transparent) 84%,color-mix(in srgb,var(--ink-orange) 52%,transparent) 96%,transparent 96%) no-repeat 4.8vh 100%/calc(100% - 4.8vh) 100%}
.cover-pills>span:not(.cover-dot)::before{content:"✓";position:absolute;left:0;top:-.2vh;width:3.5vh;height:3.5vh;line-height:3.2vh;text-align:center;border:2px solid var(--ink-red);border-radius:.9vh;color:var(--ink-red);font-size:2.7vh;font-weight:700}
#page .cover.many .cover-pills{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:1vh 2vw;align-items:start}
#page .cover.many .cover-pills>span:not(.cover-dot){font-size:2.4vh;justify-self:start}
#page .cover-pills{text-align:left}
#page .cover.many:has(.cover-logo) .cover-tagline{grid-column:1/2;grid-row:3;max-width:100%}
#page .cover.many:has(.cover-logo) .cover-logo{grid-column:2/3;grid-row:3;width:26vw;height:13vh}
#page .cover.tight .cover-icon .ic{width:5.4vw;height:5.4vw}
#page .cover.tight .cover-icon:not(:last-child)::after{top:1.5vw}
#page .cover.tight .cover-icon-label{font-size:1.8vh}
#page .cover.tight .cover-icon-sub{display:none}
.cover-dot{display:none}
#page .cover:has(.cover-logo) .cover-logo{grid-column:2/3;width:30vw;height:22vh;align-self:center;justify-self:center;margin:0;color:var(--ink-blue)}
#page .cover-icons{gap:2.6vw;margin:.6vh 0 0;padding:0 1vw;justify-self:stretch}
.cover-icon{position:relative;text-align:center;color:var(--ink-blue)}
.cover-icon .ic{width:8vw;height:8vw}
.cover-icon:not(:last-child)::after{content:"→";position:absolute;right:-2.1vw;top:2.6vw;font-size:3.4vh;color:var(--ink-red);line-height:1}
.cover-icon-label{font-size:2.1vh;font-weight:400;color:var(--ink-black);margin-top:.4vh}
.cover-icon-sub{font-size:1.5vh;color:var(--ink-blue)}

.vignette{background:radial-gradient(ellipse at center,transparent 74%,rgba(0,0,0,.06) 100%)}
</style>
</head>
<body>
<div id="page">
  <div class="spiral"></div>
  <div class="head">
    <span class="brand" id="v-brand" data-jitter></span>
    <span class="badge" id="v-badge" data-jitter></span>
  </div>
  <div class="aside" id="v-aside" data-jitter></div>
  <div class="title" id="v-title"><span class="title-band" id="v-band" data-jitter><span id="v-title-text"></span></span><div class="subtitle" id="v-subtitle" data-jitter></div></div>
  <div id="content"><!--CONTENT--></div>
  <div class="paper-texture"></div>
  <div class="vignette"></div>
</div>
<script src="../_shared/rough.min.js"></script>
<script src="../_shared/pack.js"></script>
<script src="../_shared/layout.js"></script>
<script src="../_shared/diagrams.js"></script>
<script src="../_shared/jitter.js"></script>
<!--PAGEVARS-->
<script>
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  var pageEl = document.getElementById('page');
  document.getElementById('v-brand').textContent = '@' + PAGE.brand;
  document.getElementById('v-badge').innerHTML = '<b>[</b>Page ' + pad2(PAGE.pageNum) + ' of ' + pad2(PAGE.pageCount) + '<b>]</b>';
  document.getElementById('v-aside').textContent = PAGE.aside || '';
  if (PAGE.aside) pageEl.classList.add('has-aside');
  document.getElementById('v-title-text').textContent = PAGE.page_title;
  document.getElementById('v-subtitle').textContent = PAGE.subtitle ? '(' + PAGE.subtitle + ')' : '';
  // The leading "3." (or "Q12.") of a section heading is its own span so it can wear its own colour.
  document.querySelectorAll('.b-heading:not(.hd-ribbon)').forEach(function (h) {
    var m = /^(Q?\d+[.)])(\s+)([\s\S]+)$/i.exec(h.textContent);
    if (!m) return;
    h.textContent = '';
    var n = document.createElement('span'); n.className = 'hd-num'; n.textContent = m[1];
    h.appendChild(n); h.appendChild(document.createTextNode(m[2] + m[3]));
  });
  // A page that opens with its concept block already has the name in huge type: no second title.
  if (document.querySelector('.b-concept')) pageEl.classList.add('has-concept');
  // The cover title splits in two tones: the first half on a band, the rest in red under a swipe.
  var ct = document.querySelector('.cover-title');
  if (ct) {
    var words = ct.textContent.trim().split(/\s+/);
    if (words.length >= 3) {
      // Cut near the middle by length, and prefer to start the second tone on a pronoun or a joiner.
      var joiners = /^(you|your|we|they|that|every|can't|cant|in|for|to|with|from|and|before|after)$/i;
      var total = words.join(' ').length, cut = 1, best = Infinity, run = 0;
      for (var w = 1; w < words.length; w++) {
        run += words[w - 1].length + 1;
        var score = Math.abs(run - (total - run)) - (joiners.test(words[w]) ? total * 0.25 : 0);
        if (score < best) { best = score; cut = w; }
      }
      ct.textContent = '';
      var a = document.createElement('span'); a.className = 'ct-a'; a.textContent = words.slice(0, cut).join(' ');
      var b = document.createElement('span'); b.className = 'ct-b'; b.textContent = words.slice(cut).join(' ');
      ct.appendChild(a); ct.appendChild(document.createElement('br')); ct.appendChild(b);
    }
  }
  var tg = document.querySelector('.cover-tagline');
  if (tg && tg.textContent.length > 34) tg.classList.add('long');
  document.fonts.ready.then(function () {
    // One title line: step the face down until the band fits between the corner marks.
    var band = document.getElementById('v-band'), title = document.getElementById('v-title');
    if (title.offsetParent !== null) {
      var avail = title.clientWidth - parseFloat(getComputedStyle(title).paddingLeft) - parseFloat(getComputedStyle(title).paddingRight);
      var size = parseFloat(getComputedStyle(band).fontSize);
      var floor = size * 0.5;
      while (band.scrollWidth > avail && size > floor) { size *= 0.94; band.style.fontSize = size + 'px'; }
      // The corner note sits at the top right: if the title's right edge comes within 1vw of it,
      // step the title down 5% at a time to 75% of its size; still touching, the note moves under it.
      var aside = document.getElementById('v-aside');
      if (PAGE.aside && aside.offsetParent !== null) {
        var gap = window.innerWidth * 0.01, size0 = size;
        var collides = function () { return band.getBoundingClientRect().right > aside.getBoundingClientRect().left - gap; };
        while (collides() && size > size0 * 0.75) { size *= 0.95; band.style.fontSize = size + 'px'; }
        if (collides()) {
          pageEl.classList.add('aside-under');
          var pr = pageEl.getBoundingClientRect(), tr = title.getBoundingClientRect(), bh = aside.getBoundingClientRect().height;
          aside.style.top = (tr.bottom - pr.top - bh * 0.2) + 'px';
          title.style.marginBottom = (bh * 0.8) + 'px';
        } else {
          // A note that wraps to a second line hangs below a title with no subtitle, onto the first
          // heading of the right column: the content steps down to clear it.
          var below = aside.getBoundingClientRect().bottom + gap - title.getBoundingClientRect().bottom;
          if (below > 0) title.style.marginBottom = (parseFloat(getComputedStyle(title).marginBottom) + below) + 'px';
        }
      }
    }
    // The cover is one stack that has to fit the page: shrink the title until its lines fit the
    // width and the whole stack fits the height.
    var cover = document.querySelector('.cover');
    if (ct && cover) {
      var content = document.getElementById('content');
      var room = pageEl.clientHeight - parseFloat(getComputedStyle(pageEl).paddingBottom) - content.offsetTop;
      var cavail = ct.clientWidth, csize = parseFloat(getComputedStyle(ct).fontSize);
      var spans = ct.querySelectorAll('.ct-a,.ct-b');
      var widest = function () { var w = 0; spans.forEach(function (s) { w = Math.max(w, s.getBoundingClientRect().width); }); return w || ct.scrollWidth; };
      var csize0 = csize, tightened = false;
      if (cover.querySelectorAll('.cover-pills>span:not(.cover-dot)').length > 5) cover.classList.add('many');
      while ((widest() > cavail || cover.offsetHeight > room) && csize > 40) {
        csize *= 0.95; ct.style.fontSize = csize + 'px';
        // Past two thirds of the size the title is giving up too much: tighten the icon strip first.
        if (!tightened && csize < csize0 * 0.7) { cover.classList.add('tight'); tightened = true; }
      }
      // The subtitle has a fixed size, so a long title shrunk to fit ended up smaller than the line
      // under it. Once the title has its final size, the subtitle never goes past 55% of it.
      var sub = cover.querySelector('.cover-sub');
      if (sub) {
        var cap = csize * 0.55;
        if (parseFloat(getComputedStyle(sub).fontSize) > cap) sub.style.fontSize = cap + 'px';
      }
    }
    applyLayout({ columns: PAGE.columns, rowGapPx: PAGE.rowGapPx });
    applyJitter(PAGE.seed + PAGE.pageNum);
  });
</script>
</body>
</html>
