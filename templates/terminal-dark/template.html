<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
:root{--ink-blue:#82b7ff;--ink-red:#ff7eb6;--ink-green:#7ee2a8;--ink-black:#c6cbe3;--ink-accent:#7ee2a8;--paper:#1a1c2a}
body{font-family:'Gochi Hand',cursive;background:#0b0c13}
#page{background:#12131c;padding:7.5vh 6vw 4vh}
.winbar{position:absolute;top:0;left:0;right:0;height:4.2vh;background:#1c1e2b;display:flex;align-items:center;gap:.7vw;padding:0 3vw;z-index:2}
.winbar i{width:1.3vh;height:1.3vh;border-radius:50%;display:block}
.winbar .path{font-family:'JetBrains Mono',monospace;font-size:1.25vh;color:#5b607a;margin-left:1vw}
.series{font-family:'Caveat',cursive;text-align:center;font-size:3.1vh;font-weight:700;color:var(--ink-green);
  margin:.5vh 0 .1vh;text-shadow:0 0 14px rgba(126,226,168,.45)}
.page-title{font-family:'JetBrains Mono',monospace;text-align:center;font-size:1.4vh;color:#5b607a;margin:0 0 1.4vh}

.b-heading{font-size:2.2vh;font-weight:700;color:var(--ink-blue);margin:1.2vh 0 .4vh;text-shadow:0 0 10px rgba(130,183,255,.4)}
.b-heading::before{content:"→ ";color:var(--ink-green)}
.b-paragraph{font-size:1.62vh;color:var(--ink-black);line-height:1.9;margin:.4vh 0}
.b-bullets{margin:.4vh 0 .4vh 1.5vw}
.b-bullets li{font-size:1.6vh;color:var(--ink-black);line-height:1.95;list-style:none}
.b-bullets li::before{content:"» ";color:var(--ink-red)}
.b-sidebox{border:1px solid #2c3048 !important;border-left:.4vw solid var(--ink-green) !important;border-radius:6px;
  padding:.8vh 1.4vw;margin:1vh 0;background:var(--paper);max-width:90%}
.b-sidebox .sb-title{font-size:1.8vh;font-weight:700;color:var(--ink-green);margin-bottom:.2vh;text-shadow:0 0 10px rgba(126,226,168,.4)}
.b-sidebox li{font-size:1.52vh;color:var(--ink-black);line-height:1.8;margin-left:1.2vw;list-style:none}
.b-sidebox li::before{content:"- "}
.b-table{width:100%;border-collapse:collapse;font-size:1.42vh;background:var(--paper);margin:.8vh 0;border-radius:6px;overflow:hidden}
.b-table th{font-family:'JetBrains Mono',monospace;font-size:1.35vh;color:var(--ink-red);background:#20233a;text-transform:lowercase}
.b-table th,.b-table td{border:1px solid #2c3048;padding:.45vh .9vw;text-align:center;color:var(--ink-black)}
.b-code{font-family:'JetBrains Mono',monospace;font-size:1.35vh;color:var(--ink-black);background:var(--paper);
  border:1px solid #2c3048;border-left:.4vw solid var(--ink-green);border-radius:6px;padding:.8vh 1.3vw;margin:.8vh 0;line-height:1.8;white-space:pre-wrap;max-width:94%}
.b-callout{border:1px solid var(--ink-red) !important;border-radius:6px;padding:.8vh 1.4vw;margin:1vh 0;background:var(--paper);max-width:88%;
  box-shadow:0 0 18px rgba(255,126,182,.15)}
.b-callout .co-title{font-size:1.8vh;font-weight:700;color:var(--ink-red);text-shadow:0 0 10px rgba(255,126,182,.4)}
.b-callout .co-text{font-size:1.52vh;color:var(--ink-black);line-height:1.8}
.b-qa .qa-q{font-size:1.72vh;color:var(--ink-red);font-weight:700;margin:1vh 0 .2vh;text-shadow:0 0 10px rgba(255,126,182,.35)}
.b-qa .qa-ans-label{color:var(--ink-green);font-weight:700;margin-right:.5vw;font-family:'JetBrains Mono',monospace;font-size:1.3vh}
.b-qa .qa-a li{font-size:1.58vh;color:var(--ink-black);line-height:1.85;margin-left:2vw;list-style:none}
.b-qa .qa-a li::before{content:"- "}
.b-diagram{margin:.9vh 0}
.b-diagram .dg-flow{display:flex;align-items:center;gap:.7vw;flex-wrap:wrap;font-size:1.42vh;color:var(--ink-black)}
.b-diagram .dg-node{background:var(--paper);padding:.5vh 1.1vw;border:1px solid var(--ink-blue) !important;border-radius:5px}
.b-diagram .dg-arrow{color:var(--ink-green);font-weight:700;font-size:1.8vh}
.b-diagram-staged{border:1px dashed #454a68;border-radius:6px;padding:.7vh 1.2vw;margin:.8vh 0;font-size:1.4vh;color:#5b607a;background:var(--paper)}
.hashtags{font-family:'JetBrains Mono',monospace;font-size:1.25vh;color:var(--ink-red);border:1px solid var(--ink-red);
  border-radius:4px;display:block;width:fit-content;padding:.2vh 1vw;margin-top:1.4vh}
/* Native neon borders replace hand-drawn frames in this template. */
.b-callout svg,.b-sidebox svg,.dg-node svg{display:none}
.paper-texture{opacity:.12;filter:invert(1)}
.vignette{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%)}
</style>
</head>
<body>
<div id="page">
  <div class="winbar">
    <i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
    <span class="path" id="v-path"></span>
  </div>
  <div class="series" id="v-series" data-jitter></div>
  <div class="page-title" id="v-ptitle"></div>
  <div id="content"><!--CONTENT--></div>
  <div class="hashtags" id="v-tags"></div>
  <div class="paper-texture"></div>
  <div class="vignette"></div>
</div>
<script src="../_shared/rough.min.js"></script>
<script src="../_shared/pack.js"></script>
<script src="../_shared/layout.js"></script>
<script src="../_shared/jitter.js"></script>
<!--PAGEVARS-->
<script>
  document.getElementById('v-path').textContent = PAGE.brand + '@notes ~ ' + PAGE.series.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.md';
  document.getElementById('v-series').textContent = PAGE.series;
  document.getElementById('v-ptitle').textContent = '// ' + PAGE.brand + ' · ' + PAGE.page_title.toLowerCase() + ' · ' + String(PAGE.pageNum).padStart(2, '0');
  document.getElementById('v-tags').textContent = '#dev #notes ' + PAGE.pageNum + '/' + PAGE.pageCount;
  document.fonts.ready.then(function () {
    applyLayout({ columns: PAGE.columns, rowGapPx: PAGE.rowGapPx });
    applyJitter(PAGE.seed + PAGE.pageNum);
  });
</script>
</body>
</html>
