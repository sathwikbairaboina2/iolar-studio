<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
:root{--ink-blue:#8fe3b0;--ink-red:#ffb3c1;--ink-green:#8fe3b0;--ink-black:#e8e4d5;--ink-accent:#f2c94c;--paper:rgba(255,255,255,.04)}
body{font-family:'Architects Daughter',cursive;background:#1a2822}
#page{background:radial-gradient(ellipse at 30% 20%, #2f4438 0%, #263a30 55%, #1f3128 100%);padding:6vh 6vw 4vh}
.frame{position:absolute;inset:2%;border:.9vh solid #6b4f35;border-radius:6px;pointer-events:none;z-index:2;
  box-shadow:inset 0 0 30px rgba(0,0,0,.4)}
.head{display:flex;justify-content:space-between;font-size:1.6vh;color:var(--ink-accent);position:relative;z-index:1}
.head .brand{font-family:'Caveat',cursive;font-size:2.2vh;font-weight:700}
.series{font-family:'Caveat',cursive;text-align:center;font-size:3.2vh;font-weight:700;color:#f3f0e2;
  letter-spacing:.15vw;margin:.6vh 0 .2vh;position:relative;z-index:1;text-shadow:0 0 8px rgba(243,240,226,.25)}
.series-line{display:block;margin:.2vh auto 1vh;width:55%;border-bottom:.4vh solid var(--ink-accent);border-radius:40%;transform:rotate(-.4deg)}
.page-title{font-family:'Patrick Hand',cursive;text-align:center;font-size:1.9vh;color:var(--ink-red);
  display:block;width:fit-content;margin:0 auto 1.2vh;border:2px dashed var(--ink-red);border-radius:8px;padding:.1vh 1.6vw;position:relative;z-index:1}

.b-heading{font-family:'Caveat',cursive;font-size:2.3vh;font-weight:700;color:var(--ink-green);margin:1.2vh 0 .4vh;
  text-shadow:0 0 8px rgba(143,227,176,.3)}
.b-paragraph{font-size:1.6vh;color:var(--ink-black);line-height:1.9;margin:.4vh 0}
.b-bullets{margin:.4vh 0 .4vh 1.5vw}
.b-bullets li{font-size:1.58vh;color:var(--ink-black);line-height:1.95;list-style:none}
.b-bullets li::before{content:"› ";color:var(--ink-accent)}
.b-sidebox{border:2px dashed var(--ink-accent) !important;border-radius:6px;padding:.7vh 1.4vw;margin:1vh 0;background:var(--paper);max-width:88%;transform:rotate(.3deg)}
.b-sidebox .sb-title{font-family:'Caveat',cursive;font-size:1.9vh;font-weight:700;color:var(--ink-accent);margin-bottom:.2vh}
.b-sidebox li{font-size:1.5vh;color:#f6e7b2;line-height:1.8;margin-left:1.2vw;list-style:none}
.b-sidebox li::before{content:"• "}
.b-table{width:96%;border-collapse:collapse;font-size:1.42vh;margin:.8vh auto}
.b-table th{font-family:'Caveat',cursive;font-size:1.7vh;color:var(--ink-red)}
.b-table th,.b-table td{border:2px solid #9fb8a8;padding:.35vh .8vw;text-align:center;color:var(--ink-black)}
.b-code{font-family:'JetBrains Mono',monospace;font-size:1.35vh;color:var(--ink-green);background:rgba(0,0,0,.25);
  border:2px solid rgba(143,227,176,.4);border-radius:5px;padding:.7vh 1.2vw;margin:.8vh 0;line-height:1.75;white-space:pre-wrap;max-width:92%}
.b-callout{border-radius:6px;padding:.7vh 1.4vw;margin:1vh 0;background:var(--paper);max-width:88%}
.b-callout .co-title{font-family:'Caveat',cursive;font-size:1.9vh;font-weight:700;color:var(--ink-accent)}
.b-callout.co-cloud{border-radius:50px;text-align:center}
.b-callout .co-text{font-size:1.5vh;color:var(--ink-black);line-height:1.8}
.b-qa .qa-q{font-size:1.72vh;color:var(--ink-red);font-weight:700;margin:1vh 0 .2vh}
.b-qa .qa-ans-label{color:var(--ink-accent);font-weight:700;margin-right:.5vw}
.b-qa .qa-a li{font-size:1.58vh;color:var(--ink-black);line-height:1.85;margin-left:2vw;list-style:none}
.b-qa .qa-a li::before{content:"• "}
.b-diagram{margin:.8vh 0}
.b-diagram .dg-flow{display:flex;align-items:center;gap:.8vw;flex-wrap:wrap;font-size:1.45vh;color:var(--ink-black)}
.b-diagram .dg-node{background:var(--paper);padding:.4vh 1vw}
.b-diagram .dg-arrow{color:var(--ink-accent);font-weight:700;font-size:1.8vh}
.b-diagram-staged{border:2px dashed #777;border-radius:5px;padding:.7vh 1.2vw;margin:.8vh 0;font-size:1.4vh;color:#9aa;background:var(--paper)}
/* chalk dust */
.paper-texture{opacity:.14;filter:invert(1)}
.vignette{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.28) 100%)}
</style>
</head>
<body>
<div id="page">
  <div class="frame"></div>
  <div class="head"><span class="brand" id="v-brand" data-jitter></span><span id="v-date" data-jitter></span></div>
  <div class="series" id="v-series" data-jitter></div>
  <span class="series-line"></span>
  <div class="page-title" id="v-ptitle" data-jitter></div>
  <div id="content"><!--CONTENT--></div>
  <div class="paper-texture"></div>
  <div class="vignette"></div>
</div>
<script src="../_shared/rough.min.js"></script>
<script src="../_shared/pack.js"></script>
<script src="../_shared/layout.js"></script>
<script src="../_shared/diagrams.js"></script>
<script src="../_shared/jitter.js"></script>
<!--PAGEVARS-->
<script>
  document.getElementById('v-brand').textContent = PAGE.brand;
  document.getElementById('v-date').textContent = PAGE.date;
  document.getElementById('v-series').textContent = PAGE.series;
  document.getElementById('v-ptitle').textContent = 'Page ' + PAGE.pageNum + ' : ' + PAGE.page_title;
  document.fonts.ready.then(function () {
    applyLayout({ columns: PAGE.columns, rowGapPx: PAGE.rowGapPx });
    applyJitter(PAGE.seed + PAGE.pageNum);
  });
</script>
</body>
</html>
