<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--HEAD-->
<style>
:root{--ink-blue:#1d3557;--ink-red:#c0392b;--ink-green:#1d6d40;--ink-black:#26415e;--ink-accent:#c0392b;--paper:rgba(255,255,255,.35)}
body{font-family:'Shadows Into Light',cursive;background:#d9c98a}
#page{background:repeating-linear-gradient(#f7e9a0,#f7e9a0 calc(2.2vh - 1px),#d8c56f 2.2vh);
  padding:5vh 5vw 4vh 14vw;transform:rotate(-.5deg)}
#page::before{content:"";position:absolute;left:11vw;top:0;bottom:0;width:2px;background:#c96a6a;z-index:0}
.rip{position:absolute;top:0;left:0;right:0;height:2.2vh;background:#e8d78a;border-bottom:2px dashed #b7a24e;z-index:2}
.head{display:flex;justify-content:space-between;font-size:1.7vh;color:var(--ink-blue);position:relative;z-index:1}
.head .brand{font-family:'Caveat',cursive;font-size:2.2vh;font-weight:700;color:var(--ink-red)}
.series{font-family:'Caveat',cursive;font-size:3vh;font-weight:700;color:var(--ink-blue);margin:.6vh 0 .1vh;position:relative;z-index:1;transform:rotate(-.4deg)}
.page-title{font-size:1.7vh;color:var(--ink-red);margin:0 0 1.2vh;position:relative;z-index:1}
#page:has(#v-hero) .series{padding-right:11vw}

.b-heading{font-family:'Caveat',cursive;font-size:2.4vh;font-weight:700;color:var(--ink-blue);margin:1.1vh 0 .3vh;
  text-decoration:underline wavy var(--ink-red) 1.5px;text-underline-offset:.5vh}
.b-paragraph{font-size:1.8vh;color:var(--ink-black);line-height:1.85;margin:.4vh 0}
.b-bullets{margin:.4vh 0 .4vh 1vw}
.b-bullets li{font-size:1.78vh;color:var(--ink-black);line-height:1.9;list-style:none}
.b-bullets li::before{content:"→ ";color:var(--ink-red)}
.b-sidebox{border-radius:6px;padding:.7vh 1.4vw;margin:1vh 0;background:var(--paper);max-width:85%;transform:rotate(-.6deg)}
.b-sidebox .sb-title{font-family:'Caveat',cursive;font-size:2vh;font-weight:700;color:var(--ink-red);text-decoration:underline;margin-bottom:.2vh}
.b-sidebox li{font-size:1.65vh;color:var(--ink-black);line-height:1.8;margin-left:1.2vw;list-style:none}
.b-sidebox li::before{content:"✓ ";color:var(--ink-green)}
.b-table{width:100%;border-collapse:collapse;font-size:1.55vh;background:var(--paper);margin:.8vh 0}
.b-table th{font-family:'Caveat',cursive;font-size:1.9vh;color:var(--ink-red)}
.b-table th,.b-table td{border:2px solid var(--ink-blue);padding:.35vh .8vw;text-align:center;color:var(--ink-black)}
.b-code{font-family:'JetBrains Mono',monospace;font-size:1.4vh;color:var(--ink-blue);background:rgba(255,255,255,.5);
  border:2px dashed var(--ink-blue);border-radius:5px;padding:.7vh 1.2vw;margin:.8vh 0;line-height:1.75;white-space:pre-wrap;max-width:92%}
.b-callout{border-radius:6px;padding:.7vh 1.4vw;margin:1.1vh 0;background:var(--paper);max-width:80%;transform:rotate(-1deg)}
.b-callout .co-title{font-family:'Caveat',cursive;font-size:2vh;font-weight:700;color:var(--ink-red)}
.b-callout .co-text{font-size:1.62vh;color:var(--ink-black);line-height:1.8}
.b-qa .qa-q{font-size:1.85vh;color:var(--ink-red);font-weight:700;margin:1vh 0 .2vh}
.b-qa .qa-a li{font-size:1.72vh;color:var(--ink-black);line-height:1.85;margin-left:2vw;list-style:none}
.b-qa .qa-a li::before{content:"→ "}
.b-diagram{margin:.8vh 0}
.b-diagram .dg-flow{display:flex;align-items:center;gap:.8vw;flex-wrap:wrap;font-size:1.55vh;color:var(--ink-black)}
.b-diagram .dg-node{background:var(--paper);padding:.4vh 1vw}
.b-diagram .dg-arrow{color:var(--ink-red);font-weight:700;font-size:1.9vh}
.b-diagram-staged{border:2px dashed #a99;border-radius:5px;padding:.7vh 1.2vw;margin:.8vh 0;font-size:1.5vh;color:#887;background:var(--paper)}
.stain{position:absolute;bottom:5vh;right:6vw;width:9vh;height:9vh;border-radius:50%;
  border:1.3vh solid rgba(139,94,42,.22);filter:blur(1.5px);z-index:0}
.paper-texture{opacity:.35}
</style>
</head>
<body>
<div id="page">
  <div class="rip"></div>
  <div class="head"><span class="brand" id="v-brand" data-jitter></span><span id="v-date" data-jitter></span></div>
  <div class="series" id="v-series" data-jitter></div>
  <div class="page-title" id="v-ptitle" data-jitter></div>
  <div id="content"><!--CONTENT--></div>
  <div class="stain"></div>
  <div class="paper-texture"></div>
  <div class="vignette"></div>
</div>
<script src="../_shared/rough.min.js"></script>
<script src="../_shared/pack.js"></script>
<script src="../_shared/layout.js"></script>
<script src="../_shared/diagrams.js"></script>
<script src="../_shared/jitter.js"></script>
<!--PAGEVARS-->
<script>
  document.getElementById('v-brand').textContent = PAGE.brand;
  document.getElementById('v-date').textContent = PAGE.date;
  document.getElementById('v-series').textContent = PAGE.series + ' — quick notes';
  document.getElementById('v-ptitle').textContent = 'p.' + PAGE.pageNum + ' · ' + PAGE.page_title;
  document.fonts.ready.then(function () {
    applyLayout({ columns: PAGE.columns, rowGapPx: PAGE.rowGapPx });
    applyJitter(PAGE.seed + PAGE.pageNum);
  });
</script>
</body>
</html>
